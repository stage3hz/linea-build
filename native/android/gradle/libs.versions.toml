[versions]
agp = "8.12.0"
kotlin = "2.1.20"
coroutines = "1.10.2"
junit = "4.13.2"
robolectric = "4.16"
# The HTTPS and WebSocket client. The 4.x line: 5.5 asks for compileSdk 37, which this build's Android plugin
# does not have yet, and brings an androidx start-up provider into the manifest; 4.12 needs neither.
okhttp = "4.12.0"
# SQLCipher for Android (the encrypted private storage) and the androidx interfaces its README asks for.
sqlcipher = "4.20.0"
androidx-sqlite = "2.7.0"
# Calls: WebRTC — the very build the previous app links through @livekit/react-native-webrtc 150.1.0 (its
# android/build.gradle names this artifact and version); the classes are in the package livekit.org.webrtc.
webrtc = "150.7871.01"
# Avatars: the animated emoji of the status and big emoji — the very Lottie build the previous app's Android side
# links (lottie-react-native/android/build.gradle: com.airbnb.android:lottie:6.7.1) with its Noto files (assets/emoji).
lottie = "6.7.1"
# Media: the round video with both cameras at once — the very CameraX build the previous app's own Android module
# links (modules/linea-photo/android/build.gradle: androidx.camera 1.6.0, its VideoNoteDualCamera.kt), and «Фон» of
# the photo editor — the very ML Kit subject segmentation it links (play-services-mlkit-subject-segmentation
# 16.0.0-beta1, a Google Play services module whose model Play services downloads onto the phone; the photo itself is
# processed on the phone), with play-services-base for the module-install client.
camerax = "1.6.0"
mlkit-subject = "16.0.0-beta1"
play-services-base = "18.10.1"
# Security: reading the QR code of the backup key (settings/HistorySettings.kt) — ML Kit barcode scanning through
# Google Play services (its model is downloaded by Play services onto the phone; frames never leave it).
mlkit-barcode = "18.3.1"
# Push: Firebase Cloud Messaging — the very build the previous app links through expo-notifications 57
# (its android/build.gradle: com.google.firebase:firebase-messaging:25.0.1). Only the push token and the delivery of
# the server's notification (the sender's name and «Новое сообщение» / «Входящий звонок») go through it.
firebase-messaging = "25.0.1"
# Read by the build scripts, so every module agrees.
jvm = "17"
compileSdk = "36"
minSdk = "26"
targetSdk = "36"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
sqlcipher = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
webrtc = { module = "io.github.webrtc-sdk:android-prefixed", version.ref = "webrtc" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
mlkit-subject = { module = "com.google.android.gms:play-services-mlkit-subject-segmentation", version.ref = "mlkit-subject" }
play-services-base = { module = "com.google.android.gms:play-services-base", version.ref = "play-services-base" }
mlkit-barcode = { module = "com.google.android.gms:play-services-mlkit-barcode-scanning", version.ref = "mlkit-barcode" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
