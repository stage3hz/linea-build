[package]
name = "invizent-core"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "The shared core of the INVIZENT phone apps: server protocol and the logic around end-to-end encryption, written once for iOS and Android"
publish = false

[lib]
name = "invizent_core"
# staticlib: linked into the iOS app; cdylib: loaded by the Android app; rlib: tests and tools.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
base64 = "0.22"
ed25519-dalek = "2"
url = "2"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"

# The Signal library itself, for `src/signal.rs` (feature `signal`). Nothing below is built without the feature.
# Building it needs `protoc` (set PROTOC or have it on PATH).
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.106.0", optional = true }
# What the library's own bridge uses next to it, in the library's versions: the store traits are `async_trait`s,
# the OS generator comes through `rand`, and AES-256-GCM-SIV is this crate (`rust/bridge/shared/src/crypto.rs`).
async-trait = { version = "0.1.79", optional = true }
rand = { version = "0.9.4", optional = true }
aes-gcm-siv = { version = "=0.12.0", optional = true }
uuid = { version = "1.5", optional = true }

[features]
default = []
# The Signal protocol on the official library: `invizent_core::signal::LibSignal`.
signal = ["dep:libsignal-protocol", "dep:async-trait", "dep:rand", "dep:aes-gcm-siv", "dep:uuid"]

# Android only: the types of the JNI table, for src/jni.rs. Other targets do not build it.
[target.'cfg(target_os = "android")'.dependencies]
jni-sys = "=0.3.0"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.13", features = ["ecdsa"] }
rand_core = { version = "0.6", features = ["getrandom"] }
# The cipher of the pages of old chats (tests/history_vectors.rs) without building the whole Signal library: the
# very crate and version the library itself uses (see `aes-gcm-siv` above).
aes-gcm-siv = "=0.12.0"
