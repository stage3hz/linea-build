# The iPhone app, written in Swift. The project file is generated: `xcodegen generate` in this directory.
# The shared core (native/core, Rust) is built first by build-core.sh into build/core/libinvizent_core.a.
name: Invizent
options:
  bundleIdPrefix: com.invizent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # The official package of SQLCipher (a prebuilt framework, pinned by its checksum in the package itself).
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift
    exactVersion: 4.20.0
  # WebRTC for calls (Sources/Calls): LiveKit's prebuilt framework of milestone 150 — the very build the previous
  # app links through @livekit/react-native-webrtc 150.1.0 (its podspec pins LiveKitWebRTC 150.7871.03). The
  # package is one binary target pinned by its checksum; it holds slices for the phone (arm64) and the simulator
  # (arm64 and x86_64). Its classes carry the `LK` prefix.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    exactVersion: 150.7871.03
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.17.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Invizent:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SQLCipher
      - package: LiveKitWebRTC
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: INVIZENT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        # Music keeps playing when the app is not on the screen (Sources/Music/MusicPlayer.swift).
        UIBackgroundModes: [audio]
        # Chats: the reference's typefaces — Montserrat for text, Unbounded ExtraBold for titles (Sources/Design/AppFont.swift).
        UIAppFonts: [Montserrat-Regular.ttf, Montserrat-Medium.ttf, Montserrat-SemiBold.ttf, Montserrat-Bold.ttf, Montserrat-ExtraBold.ttf, Unbounded-ExtraBold.ttf]
        # Voice messages and round videos (Sources/Voice, Sources/Video): asked when the record button is first held.
        # Calls (Sources/Calls) use the same two: asked at the first call and at the first video call.
        NSMicrophoneUsageDescription: "Микрофон нужен для звонков и чтобы записывать голосовые и видеосообщения. Он включается только во время звонка и пока вы держите кнопку записи."
        # Composer: also the camera tile of the paperclip's panel (a photo or a video straight from the chat).
        NSCameraUsageDescription: "Камера нужна для видеозвонков, видеосообщений в кружке и снимков прямо из чата. Она включается только во время видеозвонка, пока открыта запись или съёмка."
        # Composer/Attachments: «Сохранить фото» / «Сохранить видео» of a message (Sources/Attachments/SaveMedia.swift) —
        # add-only: the app puts the chosen photo or video into the gallery and never sees what else is there.
        NSPhotoLibraryAddUsageDescription: "Чтобы сохранять фото и видео из чатов в галерею. Инвиз только добавляет выбранный снимок и не видит остальные фото."
        # Composer: the paperclip's panel shows «Недавние» from the gallery (Sources/Attachments/AttachmentPanel.swift) —
        # asked only when the panel is first opened; the limited-library choice is offered as the reference did.
        NSPhotoLibraryUsageDescription: "Выберите фото и видео для вложения в сообщение."
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        # Security: «Код-пароль» — Face ID is asked only when the person turns «Разблокировка Face ID» on (Sources/Security).
        NSFaceIDUsageDescription: "Face ID открывает Инвиз без ввода код-пароля."
        # Links: invitations open the app (Sources/Links/DeepLinks.swift), as linea://invite/CODE did before.
        CFBundleURLTypes:
          - CFBundleURLName: com.invizent.app.invite
            CFBundleURLSchemes: [linea, invizent]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invizent.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Effects: «Иконка приложения» — the reference's other icons (Sources/Settings/AppearanceEffects.swift).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Outline AppIcon-Light AppIcon-Aurora"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/InvizentCore.h
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/build/core"]
        OTHER_LDFLAGS: ["$(inherited)", "-linvizent_core"]
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
