# The iPhone app, written in Swift. The project file is generated: `xcodegen generate` in this directory.
# The shared core (native/core, Rust) is built first by build-core.sh into build/core/libinvizent_core.a.
name: Invizent
options:
  bundleIdPrefix: com.invizent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  # The official package of SQLCipher (a prebuilt framework, pinned by its checksum in the package itself).
  SQLCipher:
    url: https://github.com/sqlcipher/SQLCipher.swift
    exactVersion: 4.20.0
  # WebRTC for calls (Sources/Calls): LiveKit's prebuilt framework of milestone 150 — the very build the previous
  # app links through @livekit/react-native-webrtc 150.1.0 (its podspec pins LiveKitWebRTC 150.7871.03). The
  # package is one binary target pinned by its checksum; it holds slices for the phone (arm64) and the simulator
  # (arm64 and x86_64). Its classes carry the `LK` prefix.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework
    exactVersion: 150.7871.03
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.17.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Invizent:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: SQLCipher
      - package: LiveKitWebRTC
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: INVIZENT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        # Music keeps playing when the app is not on the screen (Sources/Music/MusicPlayer.swift).
        UIBackgroundModes: [audio]
        # Voice messages and round videos (Sources/Voice, Sources/Video): asked when the record button is first held.
        # Calls (Sources/Calls) use the same two: asked at the first call and at the first video call.
        NSMicrophoneUsageDescription: "Микрофон нужен для звонков и чтобы записывать голосовые и видеосообщения. Он включается только во время звонка и пока вы держите кнопку записи."
        NSCameraUsageDescription: "Камера нужна для видеозвонков и чтобы записывать видеосообщения в кружке. Она включается только во время видеозвонка и пока открыта запись."
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.invizent.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/InvizentCore.h
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/build/core"]
        OTHER_LDFLAGS: ["$(inherited)", "-linvizent_core"]
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
