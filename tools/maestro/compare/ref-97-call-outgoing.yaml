- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- tapOn:
    text: "Профиль Тимур Богданов.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: ".*Как тебе фото.*"
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Звонок"
    timeout: 30000
    optional: true
- tapOn:
    text: "Звонок"
- waitForAnimationToEnd
- tapOn:
    text: "AllowРазрешить|OK"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 4000
    optional: true
- takeScreenshot: ref-97-call-outgoing
