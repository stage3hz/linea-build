appId: com.linea.messenger.preview
---
# Comparison setup 00-setup-saved of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- longPressOn:
    text: ".*Как тебе фото.*"
- waitForAnimationToEnd
- tapOn:
    text: "Выбрать"
- waitForAnimationToEnd
- tapOn:
    text: "Тимур Богданов: photo.png"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Тимур Богданов: Посмотри договор"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Тимур Богданов: voice-.*"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Тимур Богданов: circle-.*"
    direction: UP
    timeout: 40000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "Тимур Богданов: circle-.*"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: ".*Встреча переносится на пятницу.*"
    direction: UP
    timeout: 40000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: ".*Встреча переносится на пятницу.*"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "В Избранное"
- waitForAnimationToEnd
