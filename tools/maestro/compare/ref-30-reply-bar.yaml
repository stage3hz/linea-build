appId: com.linea.messenger.preview
---
# Comparison shot 30-reply-bar of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- scrollUntilVisible:
    element:
      text: ".*Список покупок.*"
    direction: UP
    timeout: 40000
    centerElement: true
- waitForAnimationToEnd
- longPressOn:
    text: ".*Список покупок.*"
- waitForAnimationToEnd
- tapOn:
    text: "Ответить"
- waitForAnimationToEnd
- takeScreenshot: ref-30-reply-bar
