appId: com.linea.messenger.preview
---
# Comparison shot 30-reply-bar of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- scrollUntilVisible:
    element:
      text: ".*Список покупок.*"
    direction: UP
    timeout: 40000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: ".*Список покупок.*"
          direction: UP
          timeout: 40000
          centerElement: true
- runFlow:
    when:
      notVisible: ".*Список покупок.*"
    commands:
      - scrollUntilVisible:
          element:
            text: ".*Список покупок.*"
          direction: UP
          timeout: 40000
          centerElement: true
- waitForAnimationToEnd
- longPressOn:
    text: ".*Список покупок.*"
- waitForAnimationToEnd
- tapOn:
    text: "Ответить"
- waitForAnimationToEnd
- takeScreenshot: ref-30-reply-bar
