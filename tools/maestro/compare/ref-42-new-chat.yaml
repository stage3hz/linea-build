appId: com.linea.messenger.preview
---
# Comparison shot 42-new-chat of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Новый чат"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Друзья.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: "Друзья.*"
    commands:
      - tapOn:
          text: "Новый чат"
          index: 0
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Друзья.*"
    timeout: 15000
    optional: true
- takeScreenshot: ref-42-new-chat
