      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Лариса Новикова.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Сообщение номер 23.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: ".*Сообщение номер 23.*"
    commands:
      - tapOn:
          text: "Лариса Новикова.*"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Сообщение номер 23.*"
