appId: com.linea.messenger.preview
---
# Comparison shot 50-profile-files of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- tapOn:
    text: "Профиль Тимур Богданов.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: ".*Как тебе фото.*"
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Файлы.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Файлы.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-50-profile-files
