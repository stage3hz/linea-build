appId: com.linea.messenger.preview
---
# Comparison shot 88-music-equalizer of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- runFlow: act/sections.yaml
- tapOn:
    text: "Музыка.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Слушать микс"
    timeout: 60000
    optional: true
- tapOn:
    text: "Слушать микс"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Открыть плеер.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: "Открыть плеер.*"
    commands:
      - tapOn:
          text: "Слушать микс"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Открыть плеер.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Открыть плеер.*"
    index: 0
- waitForAnimationToEnd
- swipe:
    from:
      text: "Перемешать|Перемешано"
    direction: LEFT
    duration: 600
- waitForAnimationToEnd
- tapOn:
    text: "Эквалайзер"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-88-music-equalizer
