appId: com.linea.messenger.preview
---
# Comparison setup 00-setup-folder of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Папки с чатами.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Папки с чатами.*"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Создать папку"
- waitForAnimationToEnd
- tapOn:
    text: "Название, например «Работа»"
- waitForAnimationToEnd
- inputText: "Работа"
- hideKeyboard
- runFlow:
    when:
      visible: "Максим Голубев[, ]+Максим Голубев.*"
    commands:
      - tapOn:
          text: "Максим Голубев[, ]+Максим Голубев.*"
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Максим Голубев[, ]+Максим Голубев.*"
    commands:
      - tapOn:
          point: "50%,62.5%"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: "Анна Лебедева[, ]+Анна Лебедева.*"
    commands:
      - tapOn:
          text: "Анна Лебедева[, ]+Анна Лебедева.*"
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: "Анна Лебедева[, ]+Анна Лебедева.*"
    commands:
      - tapOn:
          point: "50%,69.6%"
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Сохранить"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Сохранить"
- waitForAnimationToEnd
