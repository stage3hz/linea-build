appId: com.linea.messenger.preview
---
# Comparison setup 00-setup-folder of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Папки с чатами.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Папки с чатами.*"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Создать папку"
- waitForAnimationToEnd
- tapOn:
    text: "Название, например «Работа»"
- waitForAnimationToEnd
- inputText: "Р"
- inputText: "а"
- inputText: "б"
- inputText: "о"
- inputText: "т"
- inputText: "а"
- pressKey: enter
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 1500
    optional: true
- runFlow:
    when:
      visible: ".*Максим Голубев.*"
    commands:
      - tapOn:
          text: ".*Максим Голубев.*"
          index: 0
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: ".*Максим Голубев.*"
    commands:
      - tapOn:
          point: "50%,62.5%"
      - waitForAnimationToEnd
- runFlow:
    when:
      visible: ".*Анна Лебедева.*"
    commands:
      - tapOn:
          text: ".*Анна Лебедева.*"
          index: 0
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible: ".*Анна Лебедева.*"
    commands:
      - tapOn:
          point: "50%,69.6%"
      - waitForAnimationToEnd
- swipe:
    start: "50%,85%"
    end: "50%,35%"
    duration: 400
- swipe:
    start: "50%,85%"
    end: "50%,35%"
    duration: 400
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Сохранить"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Сохранить"
- waitForAnimationToEnd
