appId: com.linea.messenger.preview
---
# Comparison setup 00-setup-folder of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: "Папки с чатами.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Папки с чатами.*"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Создать папку"
- waitForAnimationToEnd
- tapOn:
    text: "Название, например «Работа»"
- waitForAnimationToEnd
- inputText: "Работа"
- hideKeyboard
- tapOn:
    text: "Максим Голубев"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Анна Лебедева"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Сохранить"
- waitForAnimationToEnd
