appId: com.linea.messenger.preview
---
# The chat with Тимур (text with formatting, a file, a photo, a voice message, then «Как тебе фото»), opened from
# the chat list of the reference. Тимур also has a story, so «Тимур Богданов.*» alone first finds his circle in the
# stories strip («Тимур Богданов, новых историй: 1»): the row is found by its own label instead — the list's row
# reads «Тимур Богданов[ <emoji status>][ 🔕]. <last message>» (mobile/modules/linea-chatlist/ios/LineChatListModule.swift, ChatRowCell),
# the JavaScript row «Тимур Богданов, непрочитанных N» (mobile/src/ChatListScreen.tsx). The row's preview also says
# «Как тебе фото», so the chat counts as open only once its composer (testID chat-composer) is there.
- tapOn:
    text: "Тимур Богданов( [^.,]+)?(\\. .*|, непрочитанных.*|, помечен.*)?"
- extendedWaitUntil:
    visible:
      id: "chat-composer"
    timeout: 15000
    optional: true
# A touch taken for a hold brings the row's preview with its menu instead of the chat (the run of d526af5f lost
# 04-chat-media to it): the preview is put away by a touch beside it. Then, the chat still not open (that touch, or
# one that was lost), the row is touched again.
- runFlow:
    when:
      visible: "Удалить чат"
    commands:
      - tapOn:
          point: "50%,6%"
      - waitForAnimationToEnd
- runFlow:
    when:
      notVisible:
        id: "chat-composer"
    commands:
      - tapOn:
          text: "Тимур Богданов( [^.,]+)?(\\. .*|, непрочитанных.*|, помечен.*)?"
- extendedWaitUntil:
    visible:
      id: "chat-composer"
    timeout: 20000
    optional: true
# Two touches that opened nothing (the reference's 78 of the run of 00dde8d5 stayed on its list): the app is started
# afresh and the row touched on a list that has come to rest.
- runFlow:
    when:
      notVisible:
        id: "chat-composer"
    commands:
      - runFlow: ref-home.yaml
      - tapOn:
          text: "Тимур Богданов( [^.,]+)?(\\. .*|, непрочитанных.*|, помечен.*)?"
- extendedWaitUntil:
    visible:
      id: "chat-composer"
    timeout: 60000
- extendedWaitUntil:
    visible: ".*Как тебе фото.*"
    timeout: 120000
- waitForAnimationToEnd
