appId: com.linea.messenger.preview
---
# The comparison's version of tools/maestro/takeover-read.yaml: the previous app opens the chat list, Анна's chat
# and Тимур's chat once, so what the seeding sent is decrypted and stored before the screens are photographed.
# Тимур's chat now ends with the attachments and «Как тебе фото» (tools/sim-seed.mjs, SIM_SEED_RICH=1), not with
# «Не забудь!», which is why the shared flow cannot be used here. Waits are generous: decrypting ~75 messages,
# a few of them with files, takes a while on a busy runner.
- launchApp
- extendedWaitUntil:
    visible: "Чаты"
    timeout: 300000
- tapOn:
    text: "Allow|Разрешить"
    optional: true
- extendedWaitUntil:
    visible: "Анна Лебедева( [^.,]+)?(\\. .*|, непрочитанных.*|, помечен.*)?"
    timeout: 180000
- waitForAnimationToEnd
# Анна's row, not her circle in the stories strip (see open-timur.yaml).
- tapOn:
    text: "Анна Лебедева( [^.,]+)?(\\. .*|, непрочитанных.*|, помечен.*)?"
- extendedWaitUntil:
    visible: ".*Ок, жду.*|.*Пропущенный.*|.*Звонок.*"
    timeout: 120000
    optional: true
- waitForAnimationToEnd
- launchApp
- extendedWaitUntil:
    visible: "Тимур Богданов( [^.,]+)?(\\. .*|, непрочитанных.*|, помечен.*)?"
    timeout: 300000
# Тимур's row, not his circle in the stories strip (see open-timur.yaml).
- tapOn:
    text: "Тимур Богданов( [^.,]+)?(\\. .*|, непрочитанных.*|, помечен.*)?"
- extendedWaitUntil:
    visible:
      id: "chat-composer"
    timeout: 120000
    optional: true
- extendedWaitUntil:
    visible: ".*Как тебе фото.*"
    timeout: 180000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: ref-read-timur
- launchApp
- extendedWaitUntil:
    visible: "Чаты"
    timeout: 300000
- waitForAnimationToEnd
