appId: com.linea.messenger.preview
---
# Comparison setup 00-setup-failed of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- scrollUntilVisible:
    element:
      text: "Вера.*"
    direction: DOWN
    timeout: 30000
- swipe:
    start: "50%,62%"
    end: "50%,44%"
    duration: 400
- waitForAnimationToEnd
- tapOn:
    text: "Вера.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat-composer"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "chat-composer"
    commands:
      - tapOn:
          text: "Вера.*"
          index: 0
- extendedWaitUntil:
    visible:
      id: "chat-composer"
    timeout: 30000
    optional: true
- tapOn:
    id: "chat-composer"
- inputText: "Это сообщение не дойдёт"
- tapOn:
    id: "chat-send"
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 6000
    optional: true
