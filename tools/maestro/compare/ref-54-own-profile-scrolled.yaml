appId: com.linea.messenger.preview
---
# Comparison shot 54-own-profile-scrolled of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Мой профиль"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Изменить.*"
    timeout: 30000
    optional: true
- swipe:
    start: "50%,78%"
    end: "50%,30%"
    duration: 700
- waitForAnimationToEnd
- takeScreenshot: ref-54-own-profile-scrolled
