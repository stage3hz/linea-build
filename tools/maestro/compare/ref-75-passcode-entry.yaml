appId: com.linea.messenger.preview
---
# Comparison shot 75-passcode-entry of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Конфиденциальность.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Конфиденциальность.*"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Код-пароль.*"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Включить код-пароль"
- waitForAnimationToEnd
- takeScreenshot: ref-75-passcode-entry
