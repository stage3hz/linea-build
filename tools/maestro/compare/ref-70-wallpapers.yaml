appId: com.linea.messenger.preview
---
# Comparison shot 70-wallpapers of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- tapOn:
    text: "Оформление.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Обои чатов.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Обои чатов.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-70-wallpapers
