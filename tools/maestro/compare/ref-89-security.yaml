appId: com.linea.messenger.preview
---
# Comparison shot 89-security of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: "Безопасность и устройства.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Безопасность и устройства.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-89-security
