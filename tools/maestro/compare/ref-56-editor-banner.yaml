- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Изменить"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Имя пользователя.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Изменить баннер|Установить баннер"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-56-editor-banner
