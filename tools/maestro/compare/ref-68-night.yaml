appId: com.linea.messenger.preview
---
# Comparison shot 68-night of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Оформление.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Ночная тема.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Ночная тема.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-68-night
