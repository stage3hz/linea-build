appId: com.linea.messenger.preview
---
# Comparison shot 65-folders-settings of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 12000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          point: "61%,93%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Папки с чатами.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Папки с чатами.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-65-folders-settings
