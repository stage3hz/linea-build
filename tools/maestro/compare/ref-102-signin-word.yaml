appId: com.linea.messenger.preview
---
# Comparison shot 102-signin-word of the reference app (.github/workflows/native-compare.yml, plan.txt).
- launchApp
- extendedWaitUntil:
    visible:
      id: "field-Логин"
    timeout: 300000
- runFlow:
    when:
      visible:
        id: "field-Логин"
    commands:
      - tapOn:
          id: "field-Логин"
- inputText: "${LOGIN}"
- pressKey: enter
- tapOn:
    text: "Продолжить"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "field-Пароль"
    timeout: 30000
    optional: true
- extendedWaitUntil:
    visible: "Пароль.*"
    timeout: 5000
    optional: true
- tapOn:
    text: "Показать: пароль"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "field-Пароль"
    optional: true
- inputText: "${PASSWORD}"
- pressKey: enter
- tapOn:
    text: "Продолжить"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "field-Слово подтверждения"
    timeout: 30000
    optional: true
- hideKeyboard
- takeScreenshot: ref-102-signin-word
