- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: "Конфиденциальность.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Конфиденциальность.*"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Код-пароль.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-74-passcode
