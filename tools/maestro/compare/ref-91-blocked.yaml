appId: com.linea.messenger.preview
---
# Comparison shot 91-blocked of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 12000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          point: "61%,93%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Безопасность и устройства.*"
    direction: DOWN
    timeout: 40000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Безопасность и устройства.*"
          direction: DOWN
          timeout: 40000
          centerElement: true
- runFlow:
    when:
      notVisible: "Безопасность и устройства.*"
    commands:
      - scrollUntilVisible:
          element:
            text: "Безопасность и устройства.*"
          direction: DOWN
          timeout: 40000
          centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "Безопасность и устройства.*"
    index: 0
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Заблокированные"
    direction: DOWN
    timeout: 40000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Заблокированные"
          direction: DOWN
          timeout: 40000
          centerElement: true
- runFlow:
    when:
      notVisible: "Заблокированные"
    commands:
      - scrollUntilVisible:
          element:
            text: "Заблокированные"
          direction: DOWN
          timeout: 40000
          centerElement: true
- waitForAnimationToEnd
- takeScreenshot: ref-91-blocked
