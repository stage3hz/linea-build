appId: com.linea.messenger.preview
---
# Comparison shot 52-person-posts of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- runFlow: act/sections.yaml
- tapOn:
    text: "Люди.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Анна Лебедева.*"
    timeout: 30000
- tapOn:
    point: "74%,68%"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Написать"
    timeout: 15000
    optional: true
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 2000
    optional: true
- takeScreenshot: ref-52-person-posts
