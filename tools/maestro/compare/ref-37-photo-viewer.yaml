appId: com.linea.messenger.preview
---
# Comparison shot 37-photo-viewer of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- scrollUntilVisible:
    element:
      text: "Тимур Богданов: photo.png"
    direction: UP
    timeout: 40000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Тимур Богданов: photo.png"
          direction: UP
          timeout: 40000
          centerElement: true
- runFlow:
    when:
      notVisible: "Тимур Богданов: photo.png"
    commands:
      - scrollUntilVisible:
          element:
            text: "Тимур Богданов: photo.png"
          direction: UP
          timeout: 40000
          centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "Тимур Богданов: photo.png"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 3000
    optional: true
- takeScreenshot: ref-37-photo-viewer
