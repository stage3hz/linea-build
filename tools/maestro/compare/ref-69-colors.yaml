appId: com.linea.messenger.preview
---
# Comparison shot 69-colors of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- tapOn:
    text: "Оформление.*"
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Свои цвета.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Свои цвета.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-69-colors
