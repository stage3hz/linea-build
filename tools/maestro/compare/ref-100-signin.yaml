appId: com.linea.messenger.preview
---
# Comparison shot 100-signin of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- launchApp
- extendedWaitUntil:
    visible:
      id: "field-Логин"
    timeout: 300000
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: ref-100-signin
