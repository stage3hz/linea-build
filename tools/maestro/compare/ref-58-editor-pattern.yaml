appId: com.linea.messenger.preview
---
# Comparison shot 58-editor-pattern of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- tapOn:
    text: "Изменить"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Имя пользователя.*"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: "Узор фона.*"
    direction: DOWN
    timeout: 40000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "Узор фона.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-58-editor-pattern
