appId: com.linea.messenger.preview
---
# Comparison shot 59-editor-color of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 12000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          point: "61%,93%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- tapOn:
    text: "Изменить"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Имя пользователя.*"
    timeout: 30000
    optional: true
- swipe:
    start: "98%,72%"
    end: "98%,48%"
    duration: 800
- waitForAnimationToEnd
- tapOn:
    text: "Персональный цвет.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Готово"
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: "Готово"
    commands:
      - tapOn:
          text: "Персональный цвет.*"
          index: 0
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Готово"
    timeout: 8000
    optional: true
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 1200
    optional: true
- takeScreenshot: ref-59-editor-color
