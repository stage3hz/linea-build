- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Изменить"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Имя пользователя.*"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: "Персональный цвет.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Персональный цвет.*"
- waitForAnimationToEnd
- takeScreenshot: ref-59-editor-color
