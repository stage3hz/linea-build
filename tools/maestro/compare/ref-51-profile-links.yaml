appId: com.linea.messenger.preview
---
# Comparison shot 51-profile-links of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- tapOn:
    text: "Профиль Тимур Богданов.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: ".*Как тебе фото.*"
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: "Голосовые"
    direction: DOWN
    timeout: 30000
- swipe:
    from:
      text: "Голосовые"
    direction: LEFT
    duration: 600
- waitForAnimationToEnd
- tapOn:
    text: "Ссылки.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-51-profile-links
