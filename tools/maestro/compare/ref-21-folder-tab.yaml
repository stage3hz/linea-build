appId: com.linea.messenger.preview
---
# Comparison shot 21-folder-tab of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- extendedWaitUntil:
    visible: "[Рработ]{6}"
    timeout: 15000
    optional: true
- tapOn:
    text: "[Рработ]{6}"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: ref-21-folder-tab
