appId: com.linea.messenger.preview
---
# Comparison shot 60-editor-birthday of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- tapOn:
    text: "Настройки"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: "Оформление.*"
    commands:
      - tapOn:
          text: "Настройки"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Оформление.*"
    timeout: 30000
- tapOn:
    text: "Изменить"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Имя пользователя.*"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: "День рождения.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "День рождения.*"
- waitForAnimationToEnd
- takeScreenshot: ref-60-editor-birthday
