appId: com.linea.messenger.preview
---
# Comparison shot 21-folder-tab of the native app, started by the workflow with: (no launch arguments); then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/nat-home.yaml
- extendedWaitUntil:
    visible: "[Рработ]{6}"
    timeout: 15000
    optional: true
- tapOn:
    text: "[Рработ]{6}"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: nat-21-folder-tab
