appId: com.linea.messenger.preview
---
# Comparison shot 57-status-sheet of the native app, started by the workflow with: -settings root; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- tapOn:
    text: "Сменить статус рядом с именем"
- waitForAnimationToEnd
- takeScreenshot: nat-57-status-sheet
