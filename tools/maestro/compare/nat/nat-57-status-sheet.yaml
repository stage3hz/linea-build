appId: com.linea.messenger.preview
---
# Comparison shot 57-status-sheet of the native app, started by the workflow with: -settings root; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- tapOn:
    text: "Сменить статус рядом с именем"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Значок Platina по умолчанию"
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible: "Значок Platina по умолчанию"
    commands:
      - tapOn:
          text: "Мой профиль"
          index: 0
          optional: true
      - waitForAnimationToEnd
      - extendedWaitUntil:
          visible: "Изменить.*"
          timeout: 8000
          optional: true
      - tapOn:
          text: "Статус .*"
          index: 0
          retryTapIfNoChange: false
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 1000
    optional: true
- takeScreenshot: nat-57-status-sheet
