appId: com.linea.messenger.preview
---
# Comparison shot 34-chat-header-menu of the native app, started by the workflow with: -profile chat; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- extendedWaitUntil:
    visible: "Ещё"
    timeout: 30000
    optional: true
- tapOn:
    text: "Ещё"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: nat-34-chat-header-menu
