appId: com.linea.messenger.preview
---
# Comparison shot 76-people-search of the native app, started by the workflow with: -tab people; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- tapOn:
    text: "Ник или имя пользователя"
- waitForAnimationToEnd
- inputText: "Лар"
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 3000
    optional: true
- takeScreenshot: nat-76-people-search
