appId: com.linea.messenger.preview
---
# Comparison shot 80-channel-mini-profile of the native app, started by the workflow with: -channels chat; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- extendedWaitUntil:
    visible: ".*глянь, пожалуйста.*"
    timeout: 60000
    optional: true
- tapOn:
    text: "Профиль Dimas"
    above: ".*глянь, пожалуйста.*"
    retryTapIfNoChange: false
    optional: true
- extendedWaitUntil:
    visible: "Написать"
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: "Написать"
    commands:
      - tapOn:
          point: "8%,81%"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 1500
    optional: true
- takeScreenshot: nat-80-channel-mini-profile
