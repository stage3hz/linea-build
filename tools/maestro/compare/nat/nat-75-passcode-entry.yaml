appId: com.linea.messenger.preview
---
# Comparison shot 75-passcode-entry of the native app, started by the workflow with: -settings passcode; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- tapOn:
    text: "Включить код-пароль"
- waitForAnimationToEnd
- takeScreenshot: nat-75-passcode-entry
