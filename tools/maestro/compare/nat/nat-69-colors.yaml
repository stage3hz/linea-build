appId: com.linea.messenger.preview
---
# Comparison shot 69-colors of the native app, started by the workflow with: -settings appearance; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- scrollUntilVisible:
    element:
      text: "Цвет интерфейса.*"
    direction: DOWN
    timeout: 40000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Цвет интерфейса.*"
          direction: DOWN
          timeout: 40000
          centerElement: true
- runFlow:
    when:
      notVisible: "Цвет интерфейса.*"
    commands:
      - scrollUntilVisible:
          element:
            text: "Цвет интерфейса.*"
          direction: DOWN
          timeout: 40000
          centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "Цвет интерфейса.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 1500
    optional: true
- takeScreenshot: nat-69-colors
