appId: com.linea.messenger.preview
---
# Comparison shot 61-editor-studio of the native app, started by the workflow with: -settings profile; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- scrollUntilVisible:
    element:
      text: "Рамки и анимации.*"
    direction: DOWN
    timeout: 40000
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: nat-61-editor-studio
