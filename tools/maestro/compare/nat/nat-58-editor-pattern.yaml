appId: com.linea.messenger.preview
---
# Comparison shot 58-editor-pattern of the native app, started by the workflow with: -settings profile; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- scrollUntilVisible:
    element:
      text: "Узор фона.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Узор фона.*"
- waitForAnimationToEnd
- takeScreenshot: nat-58-editor-pattern
