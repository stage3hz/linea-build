appId: com.linea.messenger.preview
---
# Comparison shot 58-editor-pattern of the native app, started by the workflow with: -settings profile; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- scrollUntilVisible:
    element:
      text: "Узор фона.*"
    direction: DOWN
    timeout: 40000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: "Узор фона.*"
          direction: DOWN
          timeout: 40000
          centerElement: true
- runFlow:
    when:
      notVisible: "Узор фона.*"
    commands:
      - scrollUntilVisible:
          element:
            text: "Узор фона.*"
          direction: DOWN
          timeout: 40000
          centerElement: true
- waitForAnimationToEnd
- tapOn:
    text: "Узор фона.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: nat-58-editor-pattern
