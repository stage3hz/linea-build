appId: com.linea.messenger.preview
---
# Comparison shot 28-chat-calls-edited of the native app, started by the workflow with: -openchat 1; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/wait-timur.yaml
- scrollUntilVisible:
    element:
      text: ".*Отклонённый видеозвонок.*"
    direction: UP
    timeout: 90000
    centerElement: true
- waitForAnimationToEnd
- takeScreenshot: nat-28-chat-calls-edited
