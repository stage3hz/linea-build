appId: com.linea.messenger.preview
---
# Comparison shot 88-music-equalizer of the native app, started by the workflow with: -tab music; then these gestures.
- tapOn:
    text: "Слушать микс"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Открыть плеер.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Открыть плеер.*"
    index: 0
- waitForAnimationToEnd
- swipe:
    from:
      text: "Перемешать|Перемешано"
    direction: LEFT
    duration: 600
- waitForAnimationToEnd
- tapOn:
    text: "Эквалайзер"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: nat-88-music-equalizer
