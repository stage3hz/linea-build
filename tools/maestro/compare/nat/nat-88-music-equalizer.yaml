appId: com.linea.messenger.preview
---
# Comparison shot 88-music-equalizer of the native app, started by the workflow with: -tab music; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- tapOn:
    text: "Слушать микс"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Открыть плеер.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: "Открыть плеер.*"
    commands:
      - tapOn:
          text: "Слушать микс"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Открыть плеер.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Открыть плеер.*"
    index: 0
- waitForAnimationToEnd
- swipe:
    from:
      text: "Перемешать|Перемешано"
    direction: LEFT
    duration: 600
- waitForAnimationToEnd
- tapOn:
    text: "Эквалайзер"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: nat-88-music-equalizer
