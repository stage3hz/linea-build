appId: com.linea.messenger.preview
---
# Comparison shot 60-editor-birthday of the native app, started by the workflow with: -settings profile; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- swipe:
    start: "98%,72%"
    end: "98%,48%"
    duration: 800
- waitForAnimationToEnd
- tapOn:
    text: "День рождения.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Готово"
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: "Готово"
    commands:
      - tapOn:
          text: "День рождения.*"
          index: 0
          optional: true
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Готово"
    timeout: 8000
    optional: true
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 1200
    optional: true
- takeScreenshot: nat-60-editor-birthday
