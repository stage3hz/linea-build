appId: com.linea.messenger.preview
---
# Comparison shot 32-selection of the native app, started by the workflow with: -openchat 1; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/wait-timur.yaml
- longPressOn:
    text: ".*Как тебе фото.*"
- waitForAnimationToEnd
- tapOn:
    text: "Выбрать"
- waitForAnimationToEnd
- tapOn:
    text: ".*Молоко уже купил.*"
    optional: true
- waitForAnimationToEnd
- takeScreenshot: nat-32-selection
