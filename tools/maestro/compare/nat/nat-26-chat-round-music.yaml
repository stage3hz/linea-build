appId: com.linea.messenger.preview
---
# Comparison shot 26-chat-round-music of the native app, started by the workflow with: -openchat 1; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/wait-timur.yaml
- scrollUntilVisible:
    element:
      text: ".*Короткое видео.*"
    direction: UP
    timeout: 45000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: ".*Короткое видео.*"
          direction: UP
          timeout: 90000
          centerElement: true
- runFlow:
    when:
      notVisible: ".*Короткое видео.*"
    commands:
      - scrollUntilVisible:
          element:
            text: ".*Короткое видео.*"
          direction: UP
          timeout: 90000
          centerElement: true
- waitForAnimationToEnd
- takeScreenshot: nat-26-chat-round-music
