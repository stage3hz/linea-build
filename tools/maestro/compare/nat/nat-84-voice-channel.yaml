appId: com.linea.messenger.preview
---
# Comparison shot 84-voice-channel of the native app, started by the workflow with: -channels community; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- tapOn:
    text: "Голосовой канал Игра.*"
- waitForAnimationToEnd
- tapOn:
    text: "Allow|Разрешить|OK"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 6000
    optional: true
- takeScreenshot: nat-84-voice-channel
