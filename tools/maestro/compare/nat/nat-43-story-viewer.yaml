appId: com.linea.messenger.preview
---
# Comparison shot 43-story-viewer of the native app, started by the workflow with: (no launch arguments); then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/nat-home.yaml
- tapOn:
    text: "Анна Лебедева, (новых историй|истории просмотрены|запись).*"
    index: 0
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 1500
    optional: true
- takeScreenshot: nat-43-story-viewer
