appId: com.linea.messenger.preview
---
# Comparison shot 35-chat-profile of the native app, started by the workflow with: -openchat 1; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/wait-timur.yaml
- tapOn:
    text: "Профиль Тимур Богданов.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: ".*Как тебе фото.*"
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- takeScreenshot: nat-35-chat-profile
