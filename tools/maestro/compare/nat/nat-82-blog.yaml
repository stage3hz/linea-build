appId: com.linea.messenger.preview
---
# Comparison shot 82-blog of the native app, started by the workflow with: -tab channels; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- scrollUntilVisible:
    element:
      text: ".*Заметки.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: ".*Заметки.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 3000
    optional: true
- takeScreenshot: nat-82-blog
