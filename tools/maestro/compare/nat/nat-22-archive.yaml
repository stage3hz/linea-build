appId: com.linea.messenger.preview
---
# Comparison shot 22-archive of the native app, started by the workflow with: (no launch arguments); then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/nat-home.yaml
- extendedWaitUntil:
    visible: "Архив.*"
    timeout: 30000
    optional: true
- scrollUntilVisible:
    element:
      text: "Архив.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Архив.*"
    index: 0
    retryTapIfNoChange: false
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Вернуться к чатам.*"
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible: ".*Вернуться к чатам.*"
    commands:
      - tapOn:
          text: "Архив.*"
          index: 0
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Вернуться к чатам.*"
    timeout: 15000
    optional: true
- takeScreenshot: nat-22-archive
