appId: com.linea.messenger.preview
---
# Comparison shot 87-music-queue of the native app, started by the workflow with: -tab music; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- tapOn:
    text: "Слушать микс"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Открыть плеер.*"
    timeout: 30000
    optional: true
- tapOn:
    text: "Открыть плеер.*"
    index: 0
- waitForAnimationToEnd
- tapOn:
    text: "Ещё"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: nat-87-music-queue
