appId: com.linea.messenger.preview
---
# Comparison shot 30-reply-bar of the native app, started by the workflow with: -openchat 1; then these gestures.
- runFlow: ../act/wait-timur.yaml
- scrollUntilVisible:
    element:
      text: ".*Список покупок.*"
    direction: UP
    timeout: 40000
    centerElement: true
- waitForAnimationToEnd
- longPressOn:
    text: ".*Список покупок.*"
- waitForAnimationToEnd
- tapOn:
    text: "Ответить"
- waitForAnimationToEnd
- takeScreenshot: nat-30-reply-bar
