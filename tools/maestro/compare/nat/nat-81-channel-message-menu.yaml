appId: com.linea.messenger.preview
---
# Comparison shot 81-channel-message-menu of the native app, started by the workflow with: -channels chat; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- extendedWaitUntil:
    visible: ".*глянь, пожалуйста.*"
    timeout: 60000
    optional: true
- longPressOn:
    text: ".*глянь, пожалуйста.*"
- waitForAnimationToEnd
- takeScreenshot: nat-81-channel-message-menu
