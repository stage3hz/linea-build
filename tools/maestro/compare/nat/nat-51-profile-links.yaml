appId: com.linea.messenger.preview
---
# Comparison shot 51-profile-links of the native app, started by the workflow with: -profile chat; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- scrollUntilVisible:
    element:
      text: "Голосовые"
    direction: DOWN
    timeout: 30000
- swipe:
    from:
      text: "Голосовые"
    direction: LEFT
    duration: 600
- waitForAnimationToEnd
- tapOn:
    text: "Ссылки.*"
    index: 0
- waitForAnimationToEnd
- takeScreenshot: nat-51-profile-links
