- runFlow: ../act/nat-home.yaml
- tapOn:
    text: "Лариса Новикова.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Сообщение номер 23.*"
    timeout: 15000
    optional: true
- runFlow:
    when:
      notVisible: ".*Сообщение номер 23.*"
    commands:
      - tapOn:
          text: "Лариса Новикова.*"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Сообщение номер 23.*"
    timeout: 60000
    optional: true
- takeScreenshot: nat-29-chat-long
