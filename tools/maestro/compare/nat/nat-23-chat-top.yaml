appId: com.linea.messenger.preview
---
# Comparison shot 23-chat-top of the native app, started by the workflow with: -openchat 1; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/wait-timur.yaml
- scrollUntilVisible:
    element:
      text: ".*Собрал всё, что обещал.*"
    direction: UP
    timeout: 45000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: ".*Собрал всё, что обещал.*"
          direction: UP
          timeout: 120000
          centerElement: true
- runFlow:
    when:
      notVisible: ".*Собрал всё, что обещал.*"
    commands:
      - scrollUntilVisible:
          element:
            text: ".*Собрал всё, что обещал.*"
          direction: UP
          timeout: 120000
          centerElement: true
- waitForAnimationToEnd
- swipe:
    start: "50%,40%"
    end: "50%,75%"
    duration: 500
- swipe:
    start: "50%,40%"
    end: "50%,75%"
    duration: 500
- swipe:
    start: "50%,40%"
    end: "50%,75%"
    duration: 500
- waitForAnimationToEnd
- takeScreenshot: nat-23-chat-top
