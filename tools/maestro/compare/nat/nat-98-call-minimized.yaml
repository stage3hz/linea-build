appId: com.linea.messenger.preview
---
# Comparison shot 98-call-minimized of the native app, started by the workflow with: (no launch arguments); then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/nat-home.yaml
- tapOn:
    text: "Тимур Богданов( [^.,]+)?(\\. .*|, непрочитанных.*|, помечен.*)?"
- runFlow: ../act/wait-timur.yaml
- tapOn:
    text: "Профиль Тимур Богданов.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: ".*Как тебе фото.*"
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Звонок"
    timeout: 30000
    optional: true
- tapOn:
    text: "Звонок"
- waitForAnimationToEnd
- tapOn:
    text: "Allow|Разрешить|OK"
    optional: true
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 3000
    optional: true
- tapOn:
    text: "Свернуть звонок"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 1500
    optional: true
- takeScreenshot: nat-98-call-minimized
- tapOn:
    text: "Завершить звонок|Завершить"
    index: 0
    optional: true
- waitForAnimationToEnd
