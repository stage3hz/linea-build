appId: com.linea.messenger.preview
---
# Comparison shot 59-editor-color of the native app, started by the workflow with: -settings profile; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- scrollUntilVisible:
    element:
      text: "Персональный цвет.*"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "Персональный цвет.*"
- waitForAnimationToEnd
- takeScreenshot: nat-59-editor-color
