appId: com.linea.messenger.preview
---
# Comparison shot 99-call-history of the native app, started by the workflow with: -tab people; then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- tapOn:
    text: "Звонки.*"
    index: 0
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "a text that never shows 7f3k"
    timeout: 2000
    optional: true
- takeScreenshot: nat-99-call-history
