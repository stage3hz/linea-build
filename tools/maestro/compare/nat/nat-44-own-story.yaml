appId: com.linea.messenger.preview
---
# Comparison shot 44-own-story of the native app, started by the workflow with: (no launch arguments); then these gestures.
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: ../act/nat-home.yaml
- extendedWaitUntil:
    visible: "Моя история"
    timeout: 20000
    optional: true
- runScript:
    file: ../act/shoot-later.js
    env:
      NAME: "nat-44-own-story"
      AFTER: "3500"
- tapOn:
    point: "13%,19%"
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 300
- evalScript: ${var until = Date.now() + 1800; while (Date.now() < until);}
- evalScript: ${var until = Date.now() + 1800; while (Date.now() < until);}
- evalScript: ${var until = Date.now() + 1800; while (Date.now() < until);}
- takeScreenshot: nat-44-own-story-late
