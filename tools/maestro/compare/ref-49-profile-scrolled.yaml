appId: com.linea.messenger.preview
---
# Comparison shot 49-profile-scrolled of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- tapOn:
    text: "Профиль Тимур Богданов.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: ".*Как тебе фото.*"
    timeout: 15000
    optional: true
- waitForAnimationToEnd
- swipe:
    start: "50%,78%"
    end: "50%,30%"
    duration: 700
- waitForAnimationToEnd
- takeScreenshot: ref-49-profile-scrolled
