appId: com.linea.messenger.preview
---
# Comparison shot 25-chat-album of the reference app (.github/workflows/native-compare.yml, plan.txt).
- runFlow:
    when:
      visible: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
    commands:
      - tapOn: "Allow Full Access|Allow Access to All Photos|Разрешить доступ ко всем фото"
- runFlow: act/ref-home.yaml
- runFlow: act/open-timur.yaml
- scrollUntilVisible:
    element:
      text: ".*Три кадра с прогулки.*"
    direction: UP
    timeout: 45000
    centerElement: true
    optional: true
- runFlow:
    when:
      visible: "Переслать"
    commands:
      - tapOn:
          point: "50%,8%"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            text: ".*Три кадра с прогулки.*"
          direction: UP
          timeout: 90000
          centerElement: true
- runFlow:
    when:
      notVisible: ".*Три кадра с прогулки.*"
    commands:
      - scrollUntilVisible:
          element:
            text: ".*Три кадра с прогулки.*"
          direction: UP
          timeout: 90000
          centerElement: true
- waitForAnimationToEnd
- takeScreenshot: ref-25-chat-album
