appId: com.linea.messenger.preview
---
# Registers a fresh test account on the local test server and walks the screens (screens.yaml).
#
# Typing: ManualField accepts one code point per change, which is exactly what XCUITest typing does,
# so a whole string per inputText is fine (the "по одному символу" hint would appear otherwise — asserted).
# Keyboard: Maestro's hideKeyboard is unreliable on iOS and a tap while the keyboard is up landed on the
# wrong field (the KeyboardAvoidingView had shifted the card). So the first field of every step is left
# with the Return key — returnKeyType "next" without onSubmitEditing blurs it and the keyboard closes —
# and the second field is submitted with Return ("go" → submit). If Return did not advance the step, the
# fallback taps the submit button.
- launchApp:
    clearState: true
# The first launch after clearState on the CI runner is slow (Release JS bundle, cold simulator), and one
# hierarchy snapshot can take 30 s there: 90 s once covered only four snapshots and the screen was not up yet.
- extendedWaitUntil:
    visible: "Создать аккаунт"
    timeout: 300000
- waitForAnimationToEnd
- takeScreenshot: 00-auth
- tapOn: "Создать аккаунт"

# Step 1/5: login twice
- tapOn:
    id: "field-Логин"
- inputText: "simtester${ATTEMPT}"
- assertNotVisible: "Введи по одному символу.*"
- pressKey: enter
- tapOn:
    id: "field-Повтори логин"
- inputText: "simtester${ATTEMPT}"
- assertNotVisible: "Введи по одному символу.*"
- takeScreenshot: 01-register-login
- pressKey: enter
- runFlow:
    when:
      notVisible:
        id: "field-Имя"
    commands:
      - scrollUntilVisible:
          element:
            id: "auth-submit"
          direction: DOWN
      - tapOn:
          id: "auth-submit"
- extendedWaitUntil:
    visible:
      id: "field-Имя"
    timeout: 20000

# Step 2/5: display name and public username
- tapOn:
    id: "field-Имя"
- inputText: "Sim Tester"
- assertNotVisible: "Введи по одному символу.*"
- pressKey: enter
- tapOn:
    id: "field-Публичный @юзернейм"
- inputText: "simui_check${ATTEMPT}"
- assertNotVisible: "Введи по одному символу.*"
- pressKey: enter
- runFlow:
    when:
      notVisible:
        id: "field-Пароль"
    commands:
      - scrollUntilVisible:
          element:
            id: "auth-submit"
          direction: DOWN
      - tapOn:
          id: "auth-submit"
- extendedWaitUntil:
    visible:
      id: "field-Пароль"
    timeout: 20000

# Step 3/5: password twice
# The simulator cannot type into a secure field (iOS Password AutoFill); show it first.
- tapOn: "Показать: пароль"
- tapOn:
    id: "field-Пароль"
- inputText: "correct horse battery staple 42"
- assertNotVisible: "Введи по одному символу.*"
- pressKey: enter
# The simulator cannot type into a secure field (iOS Password AutoFill); show it first.
- tapOn: "Показать: повтори пароль"
- tapOn:
    id: "field-Повтори пароль"
- inputText: "correct horse battery staple 42"
- assertNotVisible: "Введи по одному символу.*"
- pressKey: enter
# iOS Password AutoFill offers to save the just-typed secret («Save Password?») once the secure field
# is gone; the alert covers the next step, so it is dismissed when it shows (optional: not every run gets it).
- tapOn:
    text: "Not Now|Не сейчас"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "field-Слово подтверждения"
    commands:
      - scrollUntilVisible:
          element:
            id: "auth-submit"
          direction: DOWN
      - tapOn:
          id: "auth-submit"
- extendedWaitUntil:
    visible:
      id: "field-Слово подтверждения"
    timeout: 20000
# «Save Password?» can appear only after the next step has opened and cover its fields.
- tapOn:
    text: "Not Now|Не сейчас"
    optional: true
- waitForAnimationToEnd

# Step 4/5: confirmation word twice
# The simulator cannot type into a secure field (iOS Password AutoFill); show it first.
- tapOn: "Показать: слово подтверждения"
- tapOn:
    id: "field-Слово подтверждения"
- inputText: "ludwigsalt"
- assertNotVisible: "Введи по одному символу.*"
- pressKey: enter
# The simulator cannot type into a secure field (iOS Password AutoFill); show it first.
- tapOn: "Показать: повтори слово подтверждения"
- tapOn:
    id: "field-Повтори слово подтверждения"
- inputText: "ludwigsalt"
- assertNotVisible: "Введи по одному символу.*"
- pressKey: enter
# iOS Password AutoFill offers to save the just-typed secret («Save Password?») once the secure field
# is gone; the alert covers the next step, so it is dismissed when it shows (optional: not every run gets it).
- tapOn:
    text: "Not Now|Не сейчас"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "field-Слово восстановления"
    commands:
      - scrollUntilVisible:
          element:
            id: "auth-submit"
          direction: DOWN
      - tapOn:
          id: "auth-submit"
- extendedWaitUntil:
    visible:
      id: "field-Слово восстановления"
    timeout: 20000
# «Save Password?» can appear only after the next step has opened and cover its fields.
- tapOn:
    text: "Not Now|Не сейчас"
    optional: true
- waitForAnimationToEnd

# Step 5/5: recovery word twice
# The simulator cannot type into a secure field (iOS Password AutoFill); show it first.
- tapOn: "Показать: слово восстановления"
- tapOn:
    id: "field-Слово восстановления"
- inputText: "mariposa"
- assertNotVisible: "Введи по одному символу.*"
- pressKey: enter
# The simulator cannot type into a secure field (iOS Password AutoFill); show it first.
- tapOn: "Показать: повтори слово восстановления"
- tapOn:
    id: "field-Повтори слово восстановления"
- inputText: "mariposa"
- assertNotVisible: "Введи по одному символу.*"
- takeScreenshot: 02-register-last-step
- pressKey: enter
# Sign-up runs now (three secrets hashed on the server). Wait for an outcome instead of acting at once:
# the chat list, iOS's «Save Password?» (it may come only after the screen changes) or an error.
- extendedWaitUntil:
    visible: "Избранное.*|Not Now|Не сейчас|Сервер не ответил.*|Нет связи.*"
    timeout: 120000
- tapOn:
    text: "Not Now|Не сейчас"
    optional: true
# Still on the form (Return did not submit, or the request failed): press the button once more.
- runFlow:
    when:
      notVisible: "Избранное.*"
      visible:
        id: "auth-submit"
    commands:
      - tapOn:
          id: "auth-submit"
- tapOn:
    text: "Allow"
    optional: true
- tapOn:
    text: "Разрешить"
    optional: true
- extendedWaitUntil:
    visible: "Избранное.*|Not Now|Не сейчас"
    timeout: 120000
- tapOn:
    text: "Not Now|Не сейчас"
    optional: true
- extendedWaitUntil:
    visible: "Избранное.*"
    timeout: 60000
- runFlow: screens.yaml
