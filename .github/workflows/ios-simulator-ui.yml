# The app in the iPhone Simulator, checked by a robot before a build goes to the phone.
# A local test server runs on the same Mac behind HTTPS (a test CA trusted inside this simulator only;
# TLS stays on), the app is built for the simulator with that server baked in (EXPO_PUBLIC_SIMULATOR_SERVER,
# accepted by the app only as https://localhost:<port>; release builds never set it), Maestro registers a
# test account and walks the main screens in the dark and light appearance, and the screenshots are
# uploaded. Nothing here touches the real server or real accounts. No camera in the simulator: round
# videos still need a device.
name: iOS Simulator UI check
on:
  push:
    branches: [main]
    paths: ['mobile/src/**', 'mobile/modules/**', 'tools/maestro/**', 'tools/sim-tls-proxy.mjs', '.github/workflows/ios-simulator-ui.yml', '!mobile/src/**/*.web.ts', '!mobile/src/**/*.web.tsx']
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner label
        required: false
        default: macos-15
permissions:
  contents: write
concurrency:
  # «-v2»: runs of the old group were stuck in the queue (waiting for a runner) and every new walk waited behind
  # them; a new group starts with an empty queue. A newer push now replaces a walk still in progress: the
  # latest commit is the one whose screenshots are wanted.
  group: ios-simulator-ui-v2
  cancel-in-progress: true
jobs:
  ui:
    # Apple silicon: on the Intel runner one walk saw 100 s per tap and a 30 s blocked main thread, and the
    # local server missed the 18 s register timeout. The simulator architecture is detected below.
    # macos-15 (Apple silicon): macos-26 arm64 runners were short twice in a row («The job was not acquired by
    # Runner of type hosted even after multiple attempts»), and the job was dropped after 15 min in the queue.
    # macos-15 arm64 then failed the same way four times («Due to capacity constraints, jobs targeting macOS
    # arm64 runners may experience longer queue times»), so the default is the Intel runner, which the IPA
    # build gets reliably; pass runner=macos-15 by hand when arm64 capacity is back.
    # macos-26: the runner the IPA build (ios-unsigned-ipa.yml) gets reliably; the Intel runner timed out on the first tap.
    # Two runners at once, each with its own output branch: without access to the Actions page the only sign of a
    # job that never got a runner was silence. Whichever Mac is free walks the app; branch sim-started-<runner>
    # shows that the job began, sim-output-<runner> holds its screenshots.
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runner && format('["{0}"]', inputs.runner) || '["macos-15-intel","macos-26"]') }}
    runs-on: ${{ matrix.runner }}
    # 210: the Intel Mac spent the whole former 150 on build + walk and was stopped before it could publish anything.
    timeout-minutes: 210
    env:
      APP_ENV: development
      EXPO_PUBLIC_ALLOW_LOCAL_HTTP: '0'
      EXPO_PUBLIC_SIMULATOR_SERVER: https://localhost:8443
      # The simulator build shows the experimental native message list at once (native-check.yaml photographs it).
      EXPO_PUBLIC_NATIVE_CHAT: '1'
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'  # the Intel runner needs ~150 s to start the driver; the 120 s default killed the walk
    steps:
      - uses: actions/checkout@v4
      - name: Say that the walk has started (branch sim-started-<runner>)
        run: |
          mkdir started && cd started
          echo "started $GITHUB_SHA $(date -u) ${{ matrix.runner }} $(uname -m)" > STATUS.txt
          git init -q -b started
          git config user.name "linea-ci"; git config user.email "ci@localhost"
          git add -A && git commit -qm "Simulator walk started for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:sim-started-${{ matrix.runner }}" || true
          cd .. && rm -rf started
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          pod --version || sudo gem install cocoapods
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pick the newest iPhone Pro simulator
        run: |
          xcrun simctl list devices available --json > simulators.json
          python3 - <<'PY'
          import json,os,re
          devices=json.load(open('simulators.json'))['devices']
          phones=[(tuple(map(int,re.findall(r'\d+',runtime))),d) for runtime,items in devices.items() if 'iOS' in runtime for d in items if 'iPhone' in d['name']]
          if not phones: raise SystemExit('No iPhone simulator runtime installed')
          latest=max(v for v,_ in phones)
          pros=[d for v,d in phones if v==latest and 'Pro' in d['name'] and 'Max' not in d['name']] or [d for v,d in phones if v==latest]
          phone=sorted(pros,key=lambda d:d['name'])[-1]
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('SIMULATOR_UDID='+phone['udid']+'\n')
          print('Simulator:',phone['name'],latest)
          PY
          ARCH=$(uname -m); echo "SIM_ARCH=$ARCH" >> "$GITHUB_ENV"
          if [ "$ARCH" = arm64 ]; then echo "SIM_RUST=aarch64-apple-ios-sim" >> "$GITHUB_ENV"; else echo "SIM_RUST=x86_64-apple-ios" >> "$GITHUB_ENV"; fi
      - name: Install dependencies
        run: |
          (cd mobile && npm ci --no-audit --no-fund)
          (cd server && npm ci --no-audit --no-fund)
          # tools/sim-seed.mjs encrypts with the official libsignal that desktop pins; Electron itself is not needed.
          (cd desktop && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund)
      - name: Test CA and localhost certificate (this run only)
        run: |
          OSSL=$(brew --prefix openssl@3 2>/dev/null)/bin/openssl; [ -x "$OSSL" ] || OSSL=openssl
          mkdir -p tls && cd tls
          "$OSSL" req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=INVIZENT Simulator Test CA" -keyout ca.key -out ca.pem -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
          "$OSSL" req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout leaf.key -out leaf.csr
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\n" > ext.cnf
          "$OSSL" x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -sha256 -extfile ext.cnf -out leaf.pem
      - name: Start the local test server behind HTTPS
        run: |
          mkdir -p srvdata
          (cd server && DATA_DIR="$GITHUB_WORKSPACE/srvdata" PORT=3999 HOST=127.0.0.1 nohup node src/index.js > ../server.log 2>&1 &)
          nohup node tools/sim-tls-proxy.mjs tls/leaf.pem tls/leaf.key 8443 3999 > proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS --cacert tls/ca.pem https://localhost:8443/health && break; sleep 1; done
          curl -fsS --cacert tls/ca.pem https://localhost:8443/health || { echo "::error::server never answered /health"; cat server.log proxy.log; exit 1; }
      - name: Build the app for the simulator
        run: |
          set -o pipefail
          cd mobile
          npx expo prebuild --platform ios --clean --no-install
          # Prebuilt React-Core comes from Maven Central; the runner's DNS flaked once («Could not resolve host»),
          # so the download gets three attempts before the walk is given up.
          cd ios && for attempt in 1 2 3; do pod install && break; [ "$attempt" = 3 ] && exit 1; echo "pod install failed, retry $attempt"; sleep 30; done
          SCHEME=$(basename *.xcworkspace .xcworkspace); echo "SCHEME=$SCHEME" >> "$GITHUB_ENV"
          xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild ARCHS="$SIM_ARCH" ONLY_ACTIVE_ARCH=YES \
            CARGO_BUILD_TARGET="$SIM_RUST" LINEA_SIGNAL_FFI_TARGET="$SIM_RUST" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='-' CODE_SIGN_ENTITLEMENTS='' CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES \
            build > ../../simulator-build.log 2>&1 || { tail -120 ../../simulator-build.log; exit 1; }
      - name: Boot the simulator, trust the test CA, install the app
        # Usually 4–6 min. Once it hung for 35 min with no output: every simctl call now has a time limit
        # (macOS has no `timeout`, perl's alarm does the job) and a failed boot is retried on an erased device.
        timeout-minutes: 30
        run: |
          set -euo pipefail
          APP="mobile/ios/simbuild/Build/Products/Release-iphonesimulator/$SCHEME.app"
          limit() { local s="$1"; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          booted=0
          for attempt in 1 2 3; do
            limit 120 xcrun simctl boot "$SIMULATOR_UDID" || true   # «already booted» on a retry is fine
            if limit 420 xcrun simctl bootstatus "$SIMULATOR_UDID" -b; then booted=1; break; fi
            echo "Boot attempt $attempt did not finish; erasing the simulator and trying again"
            limit 120 xcrun simctl shutdown "$SIMULATOR_UDID" || true
            limit 180 xcrun simctl erase "$SIMULATOR_UDID" || true
          done
          [ "$booted" = 1 ] || { echo "::error::The simulator never finished booting"; exit 1; }
          limit 120 xcrun simctl keychain "$SIMULATOR_UDID" add-root-cert tls/ca.pem
          limit 60 xcrun simctl status_bar "$SIMULATOR_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          for attempt in 1 2; do limit 600 xcrun simctl install "$SIMULATOR_UDID" "$APP" && break; [ "$attempt" = 2 ] && exit 1; echo "Install attempt $attempt failed"; done
      - name: Install Maestro
        # The installer once got a 504 and exited 0 (curl | bash), so the walk ran without Maestro.
        # Three attempts, and the step fails unless the binary really works.
        run: |
          for attempt in 1 2 3; do
            curl -fsSL "https://get.maestro.mobile.dev" | bash && "$HOME/.maestro/bin/maestro" --version && break
            [ "$attempt" = 3 ] && { echo "::error::Maestro did not install"; exit 1; }
            echo "Maestro install failed, retry $attempt"; rm -rf "$HOME/.maestro"; sleep 30
          done
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Walk the screens (dark, then light)
        timeout-minutes: 120
        run: |
          mkdir -p shots && cd shots
          # Screenshots taken so far go to the output branch after every stage: a walk that is stopped half-way
          # (time limit, a lost runner) still leaves what it saw.
          publish() {
            ( rm -rf "$RUNNER_TEMP/part" && mkdir -p "$RUNNER_TEMP/part" && cp -R . "$RUNNER_TEMP/part/" 2>/dev/null
              cp -R "$HOME/.maestro/tests" "$RUNNER_TEMP/part/maestro-tests" 2>/dev/null
              cd "$RUNNER_TEMP/part" && echo "running:$1 $GITHUB_SHA $(date -u) ${{ matrix.runner }}" > STATUS.txt
              # The state of the Mac itself: two walks stopped publishing half-way with no final status, and without
              # the Actions page load, memory and disk at the last sign of life are the only clue.
              { uptime; df -h / "$RUNNER_TEMP" | tail -2; vm_stat | head -8; ps -Ao %cpu,%mem,rss,etime,comm -r | cut -c1-150 | head -16; echo; ps -Ao rss,comm -m | cut -c1-150 | head -8; sysctl vm.swapusage; ps -A | wc -l; } > host.txt 2>&1
              git init -q -b part && git config user.name "linea-ci" && git config user.email "ci@localhost"
              git add -A && git commit -qm "Simulator shots so far ($1) for $GITHUB_SHA"
              limit 180 git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:sim-output-${{ matrix.runner }}" ) || true
          }
          # No maestro call may run longer than its limit (one hung for two hours with no output), and while the
          # walk goes on a picture of the simulator screen is published every four minutes: what the robot is
          # looking at can be read from the branch without the Actions page.
          limit() { local s="$1"; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          ( n=0; while true; do sleep 240; n=$((n+1)); limit 60 xcrun simctl io "$SIMULATOR_UDID" screenshot "live-$(printf %02d $n).png" >/dev/null 2>&1 || true; publish "live-$n"; done ) &
          LIVE=$!
          publish walk-begins
          # The Mac was at load 425-545 on 3-4 cores during the walk (host.txt) and went silent a minute after the
          # chat list first appeared. The falling snow keeps the software renderer busy all the time, so this
          # walk runs with the system «Reduce Motion» on (the app obeys it: motionPolicy.ts) and takes still
          # pictures; indexing and what is left of the build are stopped as well.
          sudo mdutil -a -i off >/dev/null 2>&1 || true
          pkill -f XCBBuildService 2>/dev/null || true; pkill -f SourceKitService 2>/dev/null || true; pkill -x swift-frontend 2>/dev/null || true
          limit 60 xcrun simctl spawn "$SIMULATOR_UDID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true || true
          xcrun simctl ui "$SIMULATOR_UDID" appearance dark
          # Two attempts: on a slow runner the very first XCTest tap once took 377 s (34 s on a normal run, 0.4 s
          # afterwards) and the driver gave up. Each attempt registers its own account (ATTEMPT in login/username).
          dark_ok=0
          for attempt in 1 2; do
            if limit 1500 maestro --device "$SIMULATOR_UDID" test -e THEME=dark -e ATTEMPT="$attempt" "$GITHUB_WORKSPACE/tools/maestro/register-and-screens.yaml"; then dark_ok=1; break; fi
            echo "Registration attempt $attempt failed"
            publish "registration-attempt-$attempt-failed"
          done
          if [ "$dark_ok" = 1 ]; then
            publish registered
            # People to talk to: accounts with avatars and really encrypted messages, on the local server only.
            (cd "$GITHUB_WORKSPACE" && node tools/sim-seed.mjs http://127.0.0.1:3999 "simui_check$attempt" "$GITHUB_WORKSPACE/srvdata") || echo "SEED_FAILED=1" >> "$GITHUB_ENV"
            limit 1200 maestro --device "$SIMULATOR_UDID" test -e THEME=dark "$GITHUB_WORKSPACE/tools/maestro/native-check.yaml" || echo "NATIVE_FAILED=1" >> "$GITHUB_ENV"
            xcrun simctl io "$SIMULATOR_UDID" screenshot zy-after-native.png || true
            publish native-check-done
            limit 1200 maestro --device "$SIMULATOR_UDID" test -e THEME=dark "$GITHUB_WORKSPACE/tools/maestro/screens-again.yaml" || echo "DARK_FAILED=1" >> "$GITHUB_ENV"
          else
            echo "DARK_FAILED=1" >> "$GITHUB_ENV"
          fi
          kill "$LIVE" 2>/dev/null || true
          xcrun simctl io "$SIMULATOR_UDID" screenshot zz-last-state.png || true
          publish walk-ended
      - name: Collect logs
        if: always()
        run: |
          mkdir -p shots
          cp server.log proxy.log simulators.json shots/ 2>/dev/null || true
          tail -300 simulator-build.log > shots/simulator-build-tail.log 2>/dev/null || true
          cp -R "$HOME/.maestro/tests" shots/maestro-tests 2>/dev/null || true
          # The whole walk (it takes up to two hours), not the last minutes: a launch crash happens early.
          perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl spawn "$SIMULATOR_UDID" log show --last 3h --style compact --predicate 'process == "INVIZENT"' > shots/app.log 2>/dev/null || true
          perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl spawn "$SIMULATOR_UDID" log show --last 3h --style compact --predicate 'eventMessage CONTAINS[c] "INVIZENT" OR eventMessage CONTAINS[c] "linea.messenger"' > shots/system-about-app.log 2>/dev/null || true
          # Crash reports of the app (simulator crashes land in the host's DiagnosticReports).
          mkdir -p shots/crashes
          find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 \( -name 'INVIZENT*' -o -name '*linea*' \) -mmin -240 -exec cp {} shots/crashes/ \; 2>/dev/null || true
          ls -la shots/crashes || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-ui-${{ matrix.runner }}
          path: shots
          if-no-files-found: ignore
      # Screenshots also go to branch sim-output (one fresh commit), readable with plain git.
      - name: Publish screenshots to branch sim-output
        if: always() && github.event_name != 'pull_request'
        run: |
          set -e
          [ -d shots ] || exit 0
          rm -rf pub && cp -R shots pub
          echo "${{ job.status }} $GITHUB_SHA $(date -u) ${{ matrix.runner }}" > pub/STATUS.txt
          cd pub
          git init -q -b sim-output
          git config user.name "linea-ci"; git config user.email "ci@localhost"
          git add -A && git commit -qm "Simulator shots for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:sim-output-${{ matrix.runner }}"
      - name: Fail if a walk failed
        if: env.DARK_FAILED == '1' || env.LIGHT_FAILED == '1' || env.NATIVE_FAILED == '1' || env.SEED_FAILED == '1'
        run: exit 1
