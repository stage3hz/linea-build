name: Windows desktop EXE
on:
  push:
    branches: [main, feature/desktop-screen-sharing]
    paths: ['desktop/**', 'mobile/**', '.github/workflows/windows-desktop.yml']
  workflow_dispatch:
permissions:
  contents: write  # publishes the EXE to the exe-output branch (as android-apk.yml does for the APK)
concurrency:
  group: windows-desktop
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
        working-directory: mobile
      - run: npm run test:ui
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: node scripts/inject-attest-key.mjs
        working-directory: mobile
        env:
          ATTEST_KEY: ${{ secrets.ATTEST_KEY }}
      - run: npm run build:ui
        working-directory: desktop
      # In-game overlay (x64 MSVC): invizent-overlay-hook.dll + invizent-overlay-injector.exe into
      # desktop/native/overlay/out, packaged by electron-builder as resources/overlay (extraResources).
      - name: Build in-game overlay (native)
        shell: pwsh
        run: |
          # No -G: CMake picks the newest Visual Studio on the runner (windows-latest no longer has VS 2022).
          cmake -S desktop/native/overlay -B desktop/native/overlay/build -A x64
          cmake --build desktop/native/overlay/build --config Release --parallel
          $out = "desktop/native/overlay/out"
          foreach ($f in "invizent-overlay-hook.dll", "invizent-overlay-injector.exe", "MinHook-LICENSE.txt") {
            if (-not (Test-Path "$out/$f")) { throw "missing $out/$f" }
          }
          & "$out/invizent-overlay-injector.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "injector --version failed" }
      - run: npm run test:electron
        timeout-minutes: 3
        working-directory: desktop
      - run: npm run test:single-instance
        timeout-minutes: 2
        working-directory: desktop
      - run: npm run dist:win
        working-directory: desktop
      - name: Check the packaged in-game overlay files
        shell: pwsh
        run: |
          foreach ($f in "invizent-overlay-hook.dll", "invizent-overlay-injector.exe", "MinHook-LICENSE.txt") {
            if (-not (Test-Path "desktop/release/win-unpacked/resources/overlay/$f")) { throw "not packaged: $f" }
          }
      - name: Test the packaged application and native SDK
        run: npm run test:electron
        timeout-minutes: 3
        working-directory: desktop
        env:
          INVIZENT_SMOKE_ROOT: release/win-unpacked/resources/app.asar
      - uses: actions/upload-artifact@v4
        with:
          name: invizent-windows
          path: desktop/release/*.exe
          if-no-files-found: error
      # The EXE also goes to the exe-output branch (split into 45 MB parts: cat *.part* > file.exe), so it
      # can be fetched with plain git, without the artifacts API.
      - name: Publish EXE to branch exe-output
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e
          rm -rf pub && mkdir pub
          for f in desktop/release/*.exe; do split -b 45m -d "$f" "pub/$(basename "$f").part"; done
          (cd desktop/release && sha256sum *.exe) > pub/SHA256SUMS
          echo "$GITHUB_SHA $(date -u)" > pub/STATUS.txt
          cd pub
          git init -q -b exe-output
          git config user.name "linea-ci"; git config user.email "ci@localhost"
          git add -A && git commit -qm "EXE for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:exe-output
