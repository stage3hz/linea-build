name: Publish 0.14 preview downloads
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Preview release tag
        required: true
        default: v0.14.0
      mobile_version:
        description: Version inside the verified APK and IPA
        required: true
        default: '0.14.0'
      windows_run_id:
        description: Successful Windows desktop run
        required: true
        default: '41357316009'
      ios_run_id:
        description: Successful unsigned IPA run (optional until ready)
        required: false
      apk_commit:
        description: Commit containing the verified APK in builds/0.14.0
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MOBILE_VERSION: ${{ inputs.mobile_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      WINDOWS_RUN: ${{ inputs.windows_run_id }}
      IOS_RUN: ${{ inputs.ios_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate successful runs and draft status
        id: validate
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" == v0.14.0 || "$RELEASE_TAG" == v0.14.1 || "$RELEASE_TAG" == v0.14.2 ]]
          [[ "$MOBILE_VERSION" == 0.14.0 || "$MOBILE_VERSION" == 0.14.2 ]]
          [[ "$WINDOWS_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api repos/$GH_REPO/actions/runs/$WINDOWS_RUN --jq .conclusion)" = success
          SOURCE=$(gh api repos/$GH_REPO/actions/runs/$WINDOWS_RUN --jq .head_sha)
          if [ -n "$IOS_RUN" ]; then
            [[ "$IOS_RUN" =~ ^[0-9]+$ ]]
            test "$(gh api repos/$GH_REPO/actions/runs/$IOS_RUN --jq .conclusion)" = success
            IOS_SOURCE=$(gh api repos/$GH_REPO/actions/runs/$IOS_RUN --jq .head_sha)
            # Desktop-only fixes may follow the iOS build. Shared/native mobile
            # inputs must be identical; tests and web-only adapters are excluded.
            git diff --exit-code "$SOURCE" "$IOS_SOURCE" -- mobile/ ':(glob,exclude)mobile/test/**' ':(glob,exclude)mobile/src/**/*.web.ts' ':(glob,exclude)mobile/src/**/*.web.tsx'
          fi
          if gh release view "$RELEASE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --prerelease --target "$SOURCE" --title "INVIZENT ${RELEASE_TAG#v} preview" --notes-file "docs/RELEASE-${RELEASE_TAG#v}.md"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: invizent-windows
          path: downloads
          run-id: ${{ inputs.windows_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.ios_run_id != ''
        with:
          name: linea-ios
          path: ios-download
          run-id: ${{ inputs.ios_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.apk_commit }}
          path: apk-download
      - name: Collect verified binaries and upload draft assets
        run: |
          set -euo pipefail
          (cd apk-download && sha256sum -c SHA256SUMS)
          test "$(jq -r .version apk-download/BUILD.json)" = "$MOBILE_VERSION"
          cp "apk-download/INVIZENT-$MOBILE_VERSION-Android-arm64.apk" downloads/
          if [ -n "$IOS_RUN" ]; then
            cp ios-download/INVIZENT-iOS-arm64-unsigned.ipa "downloads/INVIZENT-$MOBILE_VERSION-iOS-arm64-unsigned.ipa"
          fi
          (cd downloads && sha256sum *.exe *.apk > SHA256SUMS && if [ -n "$IOS_RUN" ]; then sha256sum *.ipa >> SHA256SUMS; fi)
          gh release upload "$RELEASE_TAG" downloads/* --clobber
