          shot 420-glass-header-appearance -demo 1 -effects 1 -settings appearance
          shot 421-switches-power -demo 1 -settings power
          shot 422-settings-root-head -demo 1 -effects 1 -settings root
          shot 423-people-glass -demo 1 -effects 1 -tab people
          shot 424-channels-glass -demo 1 -effects 1 -tab channels
          shot 425-person-profile-glass -demo 1 -effects 1 -profile chat
          shot 426-music-layout -musicdemo 1 -effects 1
