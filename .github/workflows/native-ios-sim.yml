# The native iPhone app (native/ios, Swift) with the shared core (native/core, Rust), built for the simulator
# and photographed. Runs only for the branch `native-walk`. The result — the screenshot, or the end of the
# build log when something failed — goes to the branch native-sim-output-<runner>, so it can be read without
# the Actions page. Nothing here touches the real server.
name: Native iOS simulator check
on:
  push:
    branches: [native-walk]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-ios-sim
  cancel-in-progress: true
jobs:
  sim:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Build, launch and photograph
        id: work
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"; OUT="$RUNNER_TEMP/out"
          exec > >(tee "$OUT/log.txt") 2>&1
          limit() { local s="$1"; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"; xcodebuild -version; uname -m
          ARCH=$(uname -m); if [ "$ARCH" = arm64 ]; then SIM_RUST=aarch64-apple-ios-sim; else SIM_RUST=x86_64-apple-ios; fi
          echo "== core tests"; (cd native/core && cargo test --quiet 2>&1 | grep -E "test result|FAILED|panicked" || true)
          echo "== core for $SIM_RUST"; which protoc || brew install protobuf
          native/ios/build-core.sh "$SIM_RUST"
          echo "== project"; which xcodegen || brew install xcodegen
          cd native/ios && xcodegen generate
          echo "== app"
          xcodebuild -project Invizent.xcodeproj -scheme Invizent -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd ARCHS="$ARCH" ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY='-' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES build > "$OUT/xcodebuild.log" 2>&1 || { grep -E "error|warning: unre" "$OUT/xcodebuild.log" | head -60; tail -60 "$OUT/xcodebuild.log"; exit 1; }
          tail -3 "$OUT/xcodebuild.log"
          APP="$PWD/build/dd/Build/Products/Release-iphonesimulator/Invizent.app"
          echo "== simulator"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          UDID=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json,re,sys
          devices=json.load(open(sys.argv[1]))['devices']
          phones=[(tuple(map(int,re.findall(r'\d+',runtime))),d) for runtime,items in devices.items() if 'iOS' in runtime for d in items if 'iPhone' in d['name']]
          latest=max(v for v,_ in phones)
          pros=[d for v,d in phones if v==latest and 'Pro' in d['name'] and 'Max' not in d['name']] or [d for v,d in phones if v==latest]
          phone=sorted(pros,key=lambda d:d['name'])[-1]
          sys.stderr.write('Simulator: %s %s\n'%(phone['name'],latest)); print(phone['udid'])
          PY
          )
          limit 120 xcrun simctl boot "$UDID" || true
          limit 600 xcrun simctl bootstatus "$UDID" -b
          limit 60 xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          limit 60 xcrun simctl ui "$UDID" appearance dark || true
          limit 600 xcrun simctl install "$UDID" "$APP"
          shot() { # name, launch arguments…
            local name="$1"; shift
            limit 60 xcrun simctl terminate "$UDID" com.invizent.app >/dev/null 2>&1 || true
            limit 120 xcrun simctl launch "$UDID" com.invizent.app "$@"
            sleep 12
            # The simulator sometimes stalls on a screenshot: one more try, then go on without that picture.
            limit 60 xcrun simctl io "$UDID" screenshot "$OUT/$name.png" || { sleep 5; limit 90 xcrun simctl io "$UDID" screenshot "$OUT/$name.png"; } || echo "no picture: $name"
          }
          shot 01-core-check -corecheck 1
          shot 02-chats -demo 1
          shot 03-sections -demo 1 -sections 1
          shot 04-settings -demo 1 -tab profile
          shot 05-chat -demo 1 -chat 1
          shot 06-auth -auth 1
          shot 06b-register -auth 1 -authmode register
          shot 06c-recover -auth 1 -authmode recover
          shot 06d-waiting -auth 1 -authmode waiting
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "== done"
      - uses: actions/setup-node@v4
        if: steps.work.outcome == 'success'
        with:
          node-version: 24
      - name: Real data — a local test server, a test account, really encrypted chats
        # The app signs in to a server started on this Mac (HTTPS with a test CA trusted inside this simulator
        # only), other «people» write to it with the current app's own code, and the list and a chat are
        # photographed. Nothing here touches the real server.
        id: live
        if: steps.work.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          exec > >(tee "$OUT/live-log.txt") 2>&1
          limit() { local s="$1"; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          (cd mobile && npm ci --no-audit --no-fund >/dev/null 2>&1)
          (cd server && npm ci --no-audit --no-fund >/dev/null 2>&1)
          (cd desktop && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund >/dev/null 2>&1)
          OSSL=$(brew --prefix openssl@3 2>/dev/null)/bin/openssl; [ -x "$OSSL" ] || OSSL=openssl
          mkdir -p tls && cd tls
          "$OSSL" req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=INVIZENT Simulator Test CA" -keyout ca.key -out ca.pem -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null
          "$OSSL" req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout leaf.key -out leaf.csr 2>/dev/null
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\n" > ext.cnf
          "$OSSL" x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -sha256 -extfile ext.cnf -out leaf.pem 2>/dev/null
          cd ..
          mkdir -p srvdata
          (cd server && DATA_DIR="$GITHUB_WORKSPACE/srvdata" PORT=3999 HOST=127.0.0.1 nohup node src/index.js > ../server.log 2>&1 &)
          nohup node tools/sim-tls-proxy.mjs tls/leaf.pem tls/leaf.key 8443 3999 > proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS --cacert tls/ca.pem https://localhost:8443/health && break; sleep 1; done
          limit 120 xcrun simctl keychain "$UDID" add-root-cert tls/ca.pem
          echo "== account"
          node tools/native-sim-account.mjs http://127.0.0.1:3999 nativetester native_check | sed 's/"password":"[^"]*"/"password":"…"/'
          live() { # name, seconds to wait, launch arguments…
            local name="$1" wait="$2"; shift 2
            limit 60 xcrun simctl terminate "$UDID" com.invizent.app >/dev/null 2>&1 || true
            limit 120 xcrun simctl launch "$UDID" com.invizent.app -server https://localhost:8443 "$@"
            sleep "$wait"
            # The simulator sometimes stalls on a screenshot: one more try, then go on without that picture.
            limit 60 xcrun simctl io "$UDID" screenshot "$OUT/$name.png" || { sleep 5; limit 90 xcrun simctl io "$UDID" screenshot "$OUT/$name.png"; } || echo "no picture: $name"
          }
          shot() { # name, launch arguments… (no server: sample data)
            local name="$1"; shift
            limit 60 xcrun simctl terminate "$UDID" com.invizent.app >/dev/null 2>&1 || true
            limit 120 xcrun simctl launch "$UDID" com.invizent.app "$@"
            sleep 12
            # The simulator sometimes stalls on a screenshot: one more try, then go on without that picture.
            limit 60 xcrun simctl io "$UDID" screenshot "$OUT/$name.png" || { sleep 5; limit 90 xcrun simctl io "$UDID" screenshot "$OUT/$name.png"; } || echo "no picture: $name"
          }
          echo "== sign in (the app makes its keys and publishes them)"
          live 07-signed-in 25 -login nativetester -password 'Synthetic!Native.42' -word ambergardenprism
          echo "== other people write"
          node tools/sim-seed.mjs http://127.0.0.1:3999 native_check "$GITHUB_WORKSPACE/srvdata" nativetester 'Synthetic!Native.42' ambergardenprism || echo "seeding failed"
          echo "== the list and a chat"
          live 08-real-chats 25
          live 09-real-chat 30 -openchat 1
          live 09b-photo-open 35 -openchat 1 -openattachment photo
          shot 09c-attach-demo -demo 1 -chat 1 -attachdemo 1
          live 10-people 25 -tab people
          live 11-profile 30 -profile chat
          live 12-people-search 30 -peoplesearch simpeer
          live 17-channels 25 -tab channels
          live 18-community 30 -channels community
          live 19-channel-chat 35 -channels chat
          shot 20-channels-demo-chat -channelsdemo chat
          shot 25-chat-menu -demo 1 -chat 1 -chatdemo menu
          shot 26-chat-reply -demo 1 -chat 1 -chatdemo reply
          shot 27-chat-quotes -demo 1 -chat 1 -chatdemo quotes
          shot 28-chat-select -demo 1 -chat 1 -chatdemo select
          shot 29-chat-pinned -demo 1 -chat 1 -chatdemo pinned
          live 30-react-real 35 -openchat 1 -chataction react
          live 31-list-archive 25 -chatlist archive
          live 32-list-search 25 -chatsearch Ксюша
          shot 33-voice-demo -demo 1 -chat 1 -voicedemo 1
          shot 34-voice-recording -demo 1 -chat 1 -voicedemo recording
          shot 35-video-demo -demo 1 -chat 1 -videodemo 1
          shot 36-link-cards -demo 1 -chat 1 -linkdemo 1
          shot 37-link-composer -demo 1 -chat 1 -linkdemo composer
          shot 38-call-outgoing -calldemo outgoing
          shot 39-call-incoming -calldemo incoming
          shot 40-call-active -calldemo active
          shot 41-call-video -calldemo video
          shot 42-call-retry -calldemo retry
          shot 43-call-bar -calldemo bar
          shot 44-appearance -demo 1 -settings appearance
          shot 45-appearance-graphite -demo 1 -settings appearance -settheme graphite
          shot 46-appearance-light -demo 1 -settings appearance -settheme light
          shot 47-accent -demo 1 -settings accent -settheme black -setaccent FF9500
          shot 48-text-xlarge -demo 1 -chat 1 -setaccent none -settextsize xlarge
          shot 49-night -demo 1 -settings night -settextsize medium -setnight schedule
          shot 49b-reset -demo 1 -setnight off -settheme black
          shot 50-stories-strip -storiesdemo strip
          shot 51-story-viewer -storiesdemo viewer
          shot 52-story-viewers -storiesdemo viewers
          shot 53-story-compose -storiesdemo compose
          shot 54-profile-posts -storiesdemo posts
          shot 55-own-posts -storiesdemo own
          shot 56-rooms-list -roomsdemo list
          shot 57-room -roomsdemo room
          shot 58-room-music -roomsdemo music
          shot 59-room-ring -roomsdemo ring
          shot 60-room-bar -roomsdemo bar
          shot 61-room-picker -roomsdemo picker
          shot 21-ai-demo -aidemo 1
          shot 22-music-demo -musicdemo 1
          shot 23-music-player -musicdemo player
          shot 62-bar-with-track -musicdemo chats
          shot 63-light-chats -demo 1 -settheme light
          shot 64-light-chat -demo 1 -chat 1 -settheme light
          shot 65-light-channels -demo 1 -tab channels -settheme light
          shot 66-light-music -musicdemo 1 -settheme light
          shot 67-light-room -roomsdemo room -settheme light
          shot 68-reset -demo 1 -settheme black
          live 24-ai 25 -tab ai
          live 13-settings 25 -settings root
          live 14-settings-profile 25 -settings profile
          live 15-settings-sessions 25 -settings sessions
          live 16-settings-security 25 -settings security
          live 16b-settings-notifications 25 -settings notifications
          live 16c-settings-data 25 -settings data
          tail -5 server.log || true
          echo "== live done"
      - name: Publish the result (branch native-sim-output-<runner>)
        if: always()
        run: |
          cd "$RUNNER_TEMP/out" 2>/dev/null || { mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"; }
          echo "${{ steps.work.outcome }} $GITHUB_SHA $(date -u) ${{ matrix.runner }} $(uname -m) live:${{ steps.live.outcome }}" > STATUS.txt
          [ -f xcodebuild.log ] && { grep -nE "error:|warning: unre|ld: " xcodebuild.log | head -200 > xcodebuild-errors.txt; tail -200 xcodebuild.log > xcodebuild-tail.txt; rm xcodebuild.log; } || true
          git init -q -b out && git config user.name "linea-ci" && git config user.email "ci@localhost"
          git add -A && git commit -qm "Native simulator check for $GITHUB_SHA: ${{ steps.work.outcome }}"
          for attempt in 1 2 3; do git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:native-sim-output-${{ matrix.runner }}" && break; sleep 15; done
      - name: Fail the job if the work failed
        if: steps.work.outcome != 'success'
        run: exit 1
