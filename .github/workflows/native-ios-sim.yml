          shot 342-chatheader-ring -demo 1 -chat 1 -chatlook header -chatlookframe aurora
          shot 343-chatheader-peek-art -demo 1 -chat 1 -chatlook peek -chatlookframe deco-corona
          shot 344-profile-chat -profiledemo chatprofile
          shot 345-profile-chat-files -profiledemo chatprofile-files
          shot 346-profile-chat-more -profiledemo chatprofile-more
          shot 347-profile-chat-mute -profiledemo chatprofile-mute
          shot 348-profile-chat-ttl -profiledemo chatprofile-ttl
          shot 349-big-emoji -demo 1 -chat 1 -chatdemo emoji
          shot 350-profile-status-animated -profiledemo person
          shot 351-people-status -demo 1 -tab people
          shot 360-forward-many -demo 1 -chat 1 -chatdemo forwardmany
          shot 361-attach-panel -demo 1 -chat 1 -attachdemo panel
          shot 362-attach-panel-selected -demo 1 -chat 1 -attachdemo panelselected
          shot 363-attach-panel-limited -demo 1 -chat 1 -attachdemo panellimited
          shot 364-attach-panel-denied -demo 1 -chat 1 -attachdemo paneldenied
          shot 365-photo-editor-remove -demo 1 -chat 1 -photoeditor remove
