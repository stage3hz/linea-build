          shot 441-chat-composer -demo 1 -chat 1
          shot 442-chat-search -demo 1 -chatsearch Ма
          shot 443-chat-search-people -demo 1 -chatsearch Мар -chatsearchscope people
          shot 450-edges-chatlist -demo 1 -effects 1
          shot 451-edges-chat -demo 1 -chat 1
          shot 452-edges-light -demo 1 -chat 1 -settheme light
          shot 452b-reset -demo 1 -settheme black
          # Sign-in with the keyboard up: nothing scrolls; the step's title, the field with its caption, the hint and
          # «Продолжить» stand above the keyboard (Auth/AuthFit.swift). This phone, then the smallest screen (iPhone SE,
          # 375×667) on a simulator made for these shots when the runtime has one.
          shot 429-auth-keyboard-login -auth 1 -authfocus 1
          shot 429b-auth-keyboard-register -auth 1 -authmode register -authfocus 1
          shot 429c-auth-keyboard-profile -auth 1 -authmode profile -authfocus 2
          shot 429d-auth-keyboard-recover -auth 1 -authmode recover -authfocus 2
          SMALL_TYPE=$(xcrun simctl list devicetypes | grep -o -E 'com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-SE-3rd-generation|com\.apple\.CoreSimulator\.SimDeviceType\.iPhone-SE--2nd-generation-' | head -1 || true)
          SMALL_RUNTIME=$(xcrun simctl list runtimes available | grep -o -E 'com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+' | sort -V | tail -1 || true)
          SMALL=""
          if [ -n "$SMALL_TYPE" ] && [ -n "$SMALL_RUNTIME" ]; then SMALL=$(limit 120 xcrun simctl create auth-small "$SMALL_TYPE" "$SMALL_RUNTIME" 2>/dev/null || true); fi
          if [ -n "$SMALL" ]; then
            MAIN_UDID="$UDID"; UDID="$SMALL"
            limit 120 xcrun simctl boot "$UDID" || true
            limit 600 xcrun simctl bootstatus "$UDID" -b || true
            limit 60 xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
            limit 60 xcrun simctl ui "$UDID" appearance dark || true
            if limit 600 xcrun simctl install "$UDID" "$APP"; then
              # A freshly made simulator is slow on its first launches: one launch to warm it, and the keyboard's
              # one-time tip («Speed up your typing…») marked as already seen so it does not cover the shots.
              limit 60 xcrun simctl spawn "$UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
              for what in camera microphone photos; do limit 30 xcrun simctl privacy "$UDID" grant "$what" com.linea.messenger.preview || true; done
              limit 240 xcrun simctl launch "$UDID" com.linea.messenger.preview -auth 1 >/dev/null 2>&1 || true
              sleep 25
              limit 60 xcrun simctl terminate "$UDID" com.linea.messenger.preview >/dev/null 2>&1 || true
              shot 430-auth-small-keyboard-login -auth 1 -authfocus 1 || echo "no picture: 430"
              shot 430b-auth-small-keyboard-register -auth 1 -authmode register -authfocus 1 || echo "no picture: 430b"
              shot 430c-auth-small-keyboard-profile -auth 1 -authmode profile -authfocus 2 || echo "no picture: 430c"
              shot 430d-auth-small-keyboard-recover -auth 1 -authmode recover -authfocus 2 || echo "no picture: 430d"
            fi
            limit 60 xcrun simctl shutdown "$UDID" || true
            limit 60 xcrun simctl delete "$UDID" || true
            UDID="$MAIN_UDID"
          else
            echo "no small iPhone simulator for the sign-in shots"
          fi
          # ChatActions: a video forwarded into the sample chat, its copy at 40 % — the ring with ✕ (ChatActions/ForwardQueue.swift).
          shot 460-forward-pending -demo 1 -chat 1 -chatdemo forwardpending
          shot 62-bar-with-track -musicdemo chats
          shot 63-light-chats -demo 1 -settheme light
          shot 64-light-chat -demo 1 -chat 1 -settheme light
          shot 65-light-channels -demo 1 -tab channels -settheme light
          shot 66-light-music -musicdemo 1 -settheme light
          shot 67-light-room -roomsdemo room -settheme light
          shot 68-reset -demo 1 -settheme black
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "== done"
      - uses: actions/setup-node@v4
        if: steps.work.outcome == 'success'
        with:
          node-version: 24
      - name: Real data — a local test server, a test account, really encrypted chats
        # The app signs in to a server started on this Mac (HTTPS with a test CA trusted inside this simulator
        # only), other «people» write to it with the current app's own code, and the list and a chat are
        # photographed. Nothing here touches the real server.
        id: live
        if: steps.work.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          exec > >(tee "$OUT/live-log.txt") 2>&1
          limit() { local s="$1"; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          (cd mobile && npm ci --no-audit --no-fund >/dev/null 2>&1)
          (cd server && npm ci --no-audit --no-fund >/dev/null 2>&1)
          (cd desktop && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund >/dev/null 2>&1)
          OSSL=$(brew --prefix openssl@3 2>/dev/null)/bin/openssl; [ -x "$OSSL" ] || OSSL=openssl
          mkdir -p tls && cd tls
          "$OSSL" req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=INVIZENT Simulator Test CA" -keyout ca.key -out ca.pem -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null
          "$OSSL" req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout leaf.key -out leaf.csr 2>/dev/null
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\n" > ext.cnf
          "$OSSL" x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -sha256 -extfile ext.cnf -out leaf.pem 2>/dev/null
          cd ..
          mkdir -p srvdata
          (cd server && DATA_DIR="$GITHUB_WORKSPACE/srvdata" PORT=3999 HOST=127.0.0.1 nohup node src/index.js > ../server.log 2>&1 &)
          nohup node tools/sim-tls-proxy.mjs tls/leaf.pem tls/leaf.key 8443 3999 > proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS --cacert tls/ca.pem https://localhost:8443/health && break; sleep 1; done
          limit 120 xcrun simctl keychain "$UDID" add-root-cert tls/ca.pem
          echo "== account"
          node tools/native-sim-account.mjs http://127.0.0.1:3999 nativetester native_check | sed 's/"password":"[^"]*"/"password":"…"/'
          live() { # name, seconds to wait, launch arguments…
            local name="$1" wait="$2"; shift 2
            limit 60 xcrun simctl terminate "$UDID" com.linea.messenger.preview >/dev/null 2>&1 || true
            limit 120 xcrun simctl launch "$UDID" com.linea.messenger.preview -server https://localhost:8443 "$@"
            sleep "$wait"
            # The simulator sometimes stalls on a screenshot: one more try, then go on without that picture.
            limit 60 xcrun simctl io "$UDID" screenshot "$OUT/$name.png" || { sleep 5; limit 90 xcrun simctl io "$UDID" screenshot "$OUT/$name.png"; } || echo "no picture: $name"
          }
          shot() { # name, launch arguments… (no server: sample data)
            local name="$1"; shift
            limit 60 xcrun simctl terminate "$UDID" com.linea.messenger.preview >/dev/null 2>&1 || true
            limit 120 xcrun simctl launch "$UDID" com.linea.messenger.preview "$@"
            sleep 12
            # The simulator sometimes stalls on a screenshot: one more try, then go on without that picture.
            limit 60 xcrun simctl io "$UDID" screenshot "$OUT/$name.png" || { sleep 5; limit 90 xcrun simctl io "$UDID" screenshot "$OUT/$name.png"; } || echo "no picture: $name"
          }
          echo "== sign in (the app makes its keys and publishes them)"
          live 07-signed-in 25 -login nativetester -password 'Synthetic!Native.42' -word ambergardenprism
          echo "== other people write"
          # SIM_SEED_FORWARD: also a small, a long (chunked) and a round video, and what the forward check below needs.
          SIM_SEED_FORWARD="$GITHUB_WORKSPACE/forward.json" node tools/sim-seed.mjs http://127.0.0.1:3999 native_check "$GITHUB_WORKSPACE/srvdata" nativetester 'Synthetic!Native.42' ambergardenprism || echo "seeding failed"
          echo "== the list and a chat"
          live 08-real-chats 25
          live 09-real-chat 30 -openchat 1
          live 09b-photo-open 35 -openchat 1 -openattachment photo
          echo "== offline: the test server stopped — the list and the chat come from the vault's copy, at once"
          # The list is kept 1.5 s and an open chat's page 2 s after the server answered (Sources/Offline/ChatCache.swift).
          # With the address refusing connections the app must still show the chats and the chat's messages.
          pkill -f "tools/sim-tls-proxy.mjs" || true
          sleep 1
          live 09d-offline-chats 12
          live 09e-offline-chat 15 -openchat 1
          nohup node tools/sim-tls-proxy.mjs tls/leaf.pem tls/leaf.key 8443 3999 >> proxy.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS --cacert tls/ca.pem https://localhost:8443/health >/dev/null && break; sleep 1; done
          live 10-people 25 -tab people
          live 11-profile 30 -profile chat
          live 12-people-search 30 -peoplesearch simpeer
          live 17-channels 25 -tab channels
          live 18-community 30 -channels community
          live 19-channel-chat 35 -channels chat
          live 30-react-real 35 -openchat 1 -chataction react
          live 31-list-archive 25 -chatlist archive
          live 32-list-search 25 -chatsearch Ксюша
          live 24-ai 25 -tab ai
          live 13-settings 25 -settings root
          live 14-settings-profile 25 -settings profile
          live 15-settings-sessions 25 -settings sessions
          live 16-settings-security 25 -settings security
          live 16b-settings-notifications 25 -settings notifications
          live 16c-settings-data 25 -settings data
          echo "== forward: every attachment of the first chat (file, photo, voice, small, long and round video) goes on to Анна's chat"
          # Last, as it reorders the list. The person there then opens each one with the reference's own code.
          live 33-forward-real 60 -openchat 1 -chataction forwardsend -forwardto simpeer0
          limit 240 node tools/sim-forward-check.mjs http://127.0.0.1:3999 "$GITHUB_WORKSPACE/forward.json" 150 || FORWARD_FAILED=1
          live 34-forward-list 25
          tail -5 server.log || true
          [ -z "${FORWARD_FAILED:-}" ] || { echo "== forward check FAILED"; exit 1; }
          echo "== live done"
      - name: Publish the result (branch native-sim-output-<runner>)
        if: always()
        run: |
          cd "$RUNNER_TEMP/out" 2>/dev/null || { mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"; }
          echo "${{ steps.work.outcome }} $GITHUB_SHA $(date -u) ${{ matrix.runner }} $(uname -m) live:${{ steps.live.outcome }}" > STATUS.txt
          [ -f xcodebuild.log ] && { grep -nE "error:|warning: unre|ld: " xcodebuild.log | head -200 > xcodebuild-errors.txt; tail -200 xcodebuild.log > xcodebuild-tail.txt; rm xcodebuild.log; } || true
          git init -q -b out && git config user.name "linea-ci" && git config user.email "ci@localhost"
          git add -A && git commit -qm "Native simulator check for $GITHUB_SHA: ${{ steps.work.outcome }}"
          for attempt in 1 2 3; do git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:native-sim-output-${{ matrix.runner }}" && break; sleep 15; done
      - name: Fail the job if the work failed
        if: steps.work.outcome != 'success'
        run: exit 1
