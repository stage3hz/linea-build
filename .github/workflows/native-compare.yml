# The side-by-side comparison: the previous app (React Native, mobile/) and the native iPhone app (native/ios)
# photographed on the SAME simulator with the SAME data, screen by screen, so every visual or behavioural difference
# can be found by looking at two pictures next to each other — and by a number: every pair gets a difference score
# and a heat map, and compare/REPORT.md lists the pairs worst first.
#
# Three jobs:
#   build   builds both apps for the simulator once (the previous app with the preview identifier
#           com.linea.messenger.preview and the local test server baked in, as in native-takeover.yml; the native app
#           with the same identifier) and hands them on as an artifact.
#   shoot   three simulators in parallel (matrix shard 1..3), each photographing its share of the screens listed in
#           tools/maestro/compare/plan.txt. On each: a LOCAL test server (HTTPS with a test CA trusted inside this
#           simulator only; TLS stays on), the previous app signs in to a made-up account, made-up people send it
#           really encrypted messages and set up the world around it (tools/sim-seed.mjs with SIM_SEED_RICH=1 →
#           tools/sim-seed-rich.mjs: every kind of message, pinned / muted / archived / blocked chats, friends and
#           requests, Platina with banner, frame, nameplate and emoji status, posts, stories, gifts, a community, a
#           room; the seeding process then stays: a person keeps typing, people are online, a flow can ring the
#           account). The previous app runs the shard's setup flows (its own messages, a reply, an edit, «Избранное»,
#           a folder, a failed message) and is photographed screen by screen (ref-NAME.yaml, from its chat list:
#           compare/ref-NAME.png). Then the native app is installed OVER it (the update keeps the session, the keys
#           and the storage) and photographed on the same screens — started with its simulator launch arguments
#           (native/ios/Sources/App/SceneDelegate.swift) and, where the plan has a flow for it, moved there by the
#           same gestures (tools/maestro/compare/nat/nat-NAME.yaml, sharing tools/maestro/compare/act/*.yaml):
#           compare/nat-NAME.png. Shard 3 finally removes the app and the simulator's keychain and photographs
#           both apps signed out (sign-in steps, registration, recovery).
#   report  puts each pair side by side (tools/compare-pairs.py: compare/pair-NAME.jpg, reference left, native
#           right; compare/INDEX.md), scores every pair (tools/maestro/compare/diff.py: mean absolute difference and
#           changed pixels with the status bar left out, compare/diff-NAME.jpg heat maps, compare/REPORT.md sorted by
#           the worst difference) and pushes everything to the branch native-compare-output.
#
# Time: build about 60-90 min; each shard about 25 min of preparation (simulator, server, sign-in, seeding), up to
# 10 min of setup flows (shard 1), then about 1.2 min per reference screen and 0.9 min per native screen (31-38 pairs:
# 65-80 min) — 95-115 min per shard, all three at once; report a few minutes. About 3 hours from the push to the
# pictures; the job limits below (150 / 245 / 30 min) leave room. The pairs are spread so that no shard has more than 38
# (tools/maestro/compare/make-flows.py prints the counts); shard 1 also runs the setup flows.
#
# Start: git push origin <commit>:native-compare
# Nothing here talks to the real server: every address of the real service resolves to this Mac for the whole run,
# the apps are pointed at https://localhost:8443 only.
name: Native iOS side-by-side comparison
on:
  push:
    branches: [native-compare]
permissions:
  contents: write
concurrency:
  group: native-compare
  cancel-in-progress: true
env:
  EXPO_NO_TELEMETRY: '1'
  CI: '1'
  SERVER: https://localhost:8443
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Keep the real service unreachable from this Mac
        run: |
          echo "127.0.0.1 api.invizent.com invizent.com invizent-api.invizent-8165e2.workers.dev 141-133-194-51.nip.io" | sudo tee -a /etc/hosts
          sudo route -n add -host 194.87.254.249 127.0.0.1 || true
          sudo dscacheutil -flushcache || true; sudo killall -HUP mDNSResponder || true
      - name: Build both apps for the simulator
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/build"; APPS="$RUNNER_TEMP/apps"; mkdir -p "$OUT" "$APPS"
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"; xcodebuild -version; uname -m
          pod --version || sudo gem install cocoapods
          ARCH=$(uname -m); if [ "$ARCH" = arm64 ]; then SIM_RUST=aarch64-apple-ios-sim; else SIM_RUST=x86_64-apple-ios; fi
          rustup target add "$SIM_RUST" || true
          # Both apps are signed the same way for the simulator (ad hoc, no team), so both get the same keychain group.
          SIGN=(CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- CODE_SIGN_ENTITLEMENTS= CODE_SIGN_INJECT_BASE_ENTITLEMENTS=YES)

          echo "== the native app"
          which protoc || brew install protobuf
          which xcodegen || brew install xcodegen
          native/ios/build-core.sh "$SIM_RUST"
          (cd native/ios && xcodegen generate && xcodebuild -project Invizent.xcodeproj -scheme Invizent -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/dd ARCHS="$ARCH" ONLY_ACTIVE_ARCH=YES "${SIGN[@]}" build > "$OUT/native-build.log" 2>&1) \
            || { grep -E "error:" "$OUT/native-build.log" | head -60; tail -60 "$OUT/native-build.log"; exit 1; }
          NATIVE_APP="$PWD/native/ios/build/dd/Build/Products/Release-iphonesimulator/Invizent.app"

          echo "== the previous app (release identifier, local test server baked in)"
          (cd mobile && npm ci --no-audit --no-fund >/dev/null 2>&1)
          # APP_ENV=development gives the preview identifier com.linea.messenger.preview (mobile/app.config.js), the build
          # the owner has on his phone (ios-unsigned-ipa.yml) and the identifier the native app carries.
          # EXPO_PUBLIC_SIMULATOR_SERVER is accepted by that app only as https://localhost:<port> (src/serverConfig.ts):
          # it then has no other address at all.
          (cd mobile && export APP_ENV=development EXPO_PUBLIC_SIMULATOR_SERVER="$SERVER" EXPO_PUBLIC_ALLOW_LOCAL_HTTP=0 \
            && npx expo prebuild --platform ios --clean --no-install \
            && cd ios && { for attempt in 1 2 3; do pod install && break; [ "$attempt" = 3 ] && exit 1; sleep 30; done; } \
            && SCHEME=$(basename *.xcworkspace .xcworkspace) && echo "$SCHEME" > "$RUNNER_TEMP/scheme" \
            && xcodebuild -workspace "$SCHEME.xcworkspace" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
              -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild ARCHS="$ARCH" ONLY_ACTIVE_ARCH=YES \
              CARGO_BUILD_TARGET="$SIM_RUST" LINEA_SIGNAL_FFI_TARGET="$SIM_RUST" "${SIGN[@]}" build > "$OUT/reference-build.log" 2>&1) \
            || { grep -E "error:" "$OUT/reference-build.log" | head -60; tail -80 "$OUT/reference-build.log"; exit 1; }
          REF_APP="$PWD/mobile/ios/simbuild/Build/Products/Release-iphonesimulator/$(cat "$RUNNER_TEMP/scheme").app"
          for app in "$REF_APP" "$NATIVE_APP"; do
            id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$app/Info.plist"); echo "$app -> $id"
            [ "$id" = com.linea.messenger.preview ] || { echo "::error::$app has identifier $id, not com.linea.messenger.preview"; exit 1; }
          done
          # The two bundles are INVIZENT.app (reference) and Invizent.app (native): one name on the Mac's case-insensitive
          # disk. Each is therefore kept, packed and unpacked in a folder of its own, never next to the other.
          codesign -d --entitlements :- "$REF_APP" > "$OUT/entitlements-reference.plist" 2>/dev/null || true
          codesign -d --entitlements :- "$NATIVE_APP" > "$OUT/entitlements-native.plist" 2>/dev/null || true
          [ -f "$REF_APP/main.jsbundle" ] || { echo "::error::$REF_APP has no main.jsbundle: not the React Native app"; exit 1; }
          # Packed with tar: the bundles keep their symbolic links and signatures on the way to the other jobs.
          tar -C "$(dirname "$REF_APP")" -czf "$APPS/reference.tgz" "$(basename "$REF_APP")"
          tar -C "$(dirname "$NATIVE_APP")" -czf "$APPS/native.tgz" "$(basename "$NATIVE_APP")"
          echo "$(basename "$REF_APP")" > "$APPS/reference-name.txt"
          ls -la "$APPS"
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: ${{ runner.temp }}/apps
          retention-days: 2
          compression-level: 0
      - name: Keep the build logs
        if: always()
        run: |
          OUT="$RUNNER_TEMP/build"; mkdir -p "$OUT"; cd "$OUT"
          for f in native-build.log reference-build.log; do [ -f "$f" ] && { grep -nE "error:|ld: " "$f" | head -200 > "${f%.log}-errors.txt"; tail -200 "$f" > "${f%.log}-tail.txt"; rm "$f"; } || true; done
          ls -la
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-logs
          path: ${{ runner.temp }}/build
          retention-days: 7

  shoot:
    needs: build
    runs-on: macos-26
    timeout-minutes: 245
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
      # The made-up account of tools/native-sim-account.mjs (lives for this run only, on the local server only).
      TEST_LOGIN: nativetester
      TEST_HANDLE: native_check
      TEST_PASSWORD: 'Synthetic!Native.42'
      TEST_WORD: ambergardenprism
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Keep the real service unreachable from this Mac
        run: |
          # Belt and braces: the apps are pointed at localhost, but should anything try the real addresses, it gets this Mac.
          echo "127.0.0.1 api.invizent.com invizent.com invizent-api.invizent-8165e2.workers.dev 141-133-194-51.nip.io" | sudo tee -a /etc/hosts
          sudo route -n add -host 194.87.254.249 127.0.0.1 || true
          sudo dscacheutil -flushcache || true; sudo killall -HUP mDNSResponder || true
      - uses: actions/download-artifact@v4
        with:
          name: apps
          path: ${{ runner.temp }}/apps
      - name: Photograph the previous app, install the native app over it, photograph it (this shard's screens)
        id: work
        continue-on-error: true
        timeout-minutes: 230
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"; CMP="$OUT/compare"; mkdir -p "$OUT/ref" "$CMP"
          exec > >(tee "$OUT/log.txt") 2>&1
          limit() { local s="$1"; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          stage() { echo "$1" > "$OUT/STAGE.txt"; echo "== $(date -u +%H:%M:%S) $1"; }
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XC/Contents/Developer"; xcodebuild -version; uname -m
          APPS="$RUNNER_TEMP/apps"
          # Separate folders: INVIZENT.app and Invizent.app are the same name on this disk (case-insensitive), so
          # unpacked side by side the second would overwrite the first.
          mkdir -p "$APPS/reference" "$APPS/native"
          tar -C "$APPS/reference" -xzf "$APPS/reference.tgz"; tar -C "$APPS/native" -xzf "$APPS/native.tgz"
          REF_APP="$APPS/reference/$(cat "$APPS/reference-name.txt")"; NATIVE_APP="$APPS/native/Invizent.app"
          # The reference is the React Native build (its JavaScript bundle inside), the native one is not.
          [ -f "$REF_APP/main.jsbundle" ] || { echo "::error::$REF_APP is not the React Native app (no main.jsbundle)"; ls "$REF_APP" | head -40; exit 1; }
          [ ! -f "$NATIVE_APP/main.jsbundle" ] || { echo "::error::$NATIVE_APP carries main.jsbundle: the reference was unpacked over it"; exit 1; }
          FLOWS="$GITHUB_WORKSPACE/tools/maestro/compare"; PLAN="$FLOWS/plan.txt"
          # The rows of this shard in one phase: name, look, native wait, native launch arguments (tab-separated).
          rows() { awk -F'|' -v s="$SHARD" -v p="$1" '/^[[:space:]]*(#|$)/ { next }
            { for (i = 1; i <= NF; i++) gsub(/^[ \t]+|[ \t]+$/, "", $i); if ($2 == s && $3 == p) print $1 "\t" $4 "\t" $5 "\t" $6 }' "$PLAN"; }
          echo "shard $SHARD: $(rows main | wc -l | tr -d ' ') screens signed in, $(rows auth | wc -l | tr -d ' ') signed out, $(rows setup | wc -l | tr -d ' ') setup flows"

          stage "local test server"
          (cd server && npm ci --no-audit --no-fund >/dev/null 2>&1)
          (cd mobile && npm ci --no-audit --no-fund >/dev/null 2>&1)
          (cd desktop && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund >/dev/null 2>&1)
          OSSL=$(brew --prefix openssl@3 2>/dev/null)/bin/openssl; [ -x "$OSSL" ] || OSSL=openssl
          mkdir -p tls && (cd tls \
            && "$OSSL" req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=INVIZENT Simulator Test CA" -keyout ca.key -out ca.pem -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null \
            && "$OSSL" req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout leaf.key -out leaf.csr 2>/dev/null \
            && printf "subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\n" > ext.cnf \
            && "$OSSL" x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -sha256 -extfile ext.cnf -out leaf.pem 2>/dev/null)
          mkdir -p srvdata
          (cd server && DATA_DIR="$GITHUB_WORKSPACE/srvdata" PORT=3999 HOST=127.0.0.1 nohup node src/index.js > "$OUT/server.log" 2>&1 &)
          proxy() { nohup node tools/sim-tls-proxy.mjs tls/leaf.pem tls/leaf.key 8443 3999 >> "$OUT/proxy.log" 2>&1 & for i in $(seq 1 30); do curl -fsS --cacert tls/ca.pem "$SERVER/health" >/dev/null && return 0; sleep 1; done; return 1; }
          proxy || { echo "::error::the local server never answered"; cat "$OUT/server.log"; exit 1; }
          ACCOUNT=$(node tools/native-sim-account.mjs http://127.0.0.1:3999 "$TEST_LOGIN" "$TEST_HANDLE")
          USER_ID=$(printf '%s' "$ACCOUNT" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).id))')
          echo "account $TEST_LOGIN id $USER_ID"; echo "$USER_ID" > "$OUT/user-id.txt"

          stage "simulator"
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          UDID=$(python3 - "$RUNNER_TEMP/simulators.json" <<'PY'
          import json,re,sys
          devices=json.load(open(sys.argv[1]))['devices']
          phones=[(tuple(map(int,re.findall(r'\d+',runtime))),d) for runtime,items in devices.items() if 'iOS' in runtime for d in items if 'iPhone' in d['name']]
          latest=max(v for v,_ in phones)
          pros=[d for v,d in phones if v==latest and 'Pro' in d['name'] and 'Max' not in d['name']] or [d for v,d in phones if v==latest]
          phone=sorted(pros,key=lambda d:d['name'])[-1]
          sys.stderr.write('Simulator: %s %s\n'%(phone['name'],latest)); print(phone['udid'])
          PY
          )
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          limit 120 xcrun simctl boot "$UDID" || true
          limit 600 xcrun simctl bootstatus "$UDID" -b
          limit 120 xcrun simctl keychain "$UDID" add-root-cert tls/ca.pem
          limit 60 xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          limit 60 xcrun simctl ui "$UDID" appearance dark || true
          limit 60 xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ReduceMotionEnabled -bool true || true
          shot() { limit 60 xcrun simctl io "$UDID" screenshot "$OUT/$1.png" >/dev/null 2>&1 || { sleep 5; limit 90 xcrun simctl io "$UDID" screenshot "$OUT/$1.png" >/dev/null 2>&1; } || echo "no picture: $1"; }
          # A screen that could not be reached: what was on the screen instead is kept under another name, with the reason.
          miss() { echo "$1: $2" >> "$CMP/missing.txt"; echo "::warning::$1: $2"; }
          # Maestro writes a picture where it was started, or next to the flow in some versions: gathered here.
          gather() { find "$GITHUB_WORKSPACE/tools/maestro" "$OUT/ref" "$HOME/.maestro" -maxdepth 5 \( -name 'ref-[0-9]*-*.png' -o -name 'nat-[0-9]*-*.png' \) -exec mv -f {} "$CMP/" \; 2>/dev/null || true; }
          grant() { for what in camera microphone photos; do limit 30 xcrun simctl privacy "$UDID" grant "$what" com.linea.messenger.preview || true; done; }
          # tools/maestro/compare/shot-server.py: a flow asks the runner for a picture a few seconds later (a story is
          # photographed while it plays; Maestro's own picture after the touch came when the story was over).
          (nohup python3 "$GITHUB_WORKSPACE/tools/maestro/compare/shot-server.py" "$UDID" "$CMP" > "$OUT/shot-server.txt" 2>&1 &)
          export PATH="$HOME/.maestro/bin:$PATH"
          MENV=(-e "LOGIN=$TEST_LOGIN" -e "PASSWORD=$TEST_PASSWORD" -e "WORD=$TEST_WORD")
          # The simulator's appearance: the previous app follows it (its theme is «Как в системе»).
          LOOK=dark
          setlook() { [ "$1" = "$LOOK" ] && return 0; limit 60 xcrun simctl ui "$UDID" appearance "$1" || true; LOOK="$1"; sleep 2; }

          stage "the previous app signs in"
          limit 600 xcrun simctl install "$UDID" "$REF_APP"
          grant
          for attempt in 1 2 3; do curl -fsSL "https://get.maestro.mobile.dev" | bash && "$HOME/.maestro/bin/maestro" --version && break; [ "$attempt" = 3 ] && exit 1; rm -rf "$HOME/.maestro"; sleep 30; done
          # Up to three tries: the flow starts the app afresh each time (launchApp with clearState) and retries the
          # typing itself; a Maestro driver that dies mid-flow (seen on these runners) gets a new try here.
          signed=0
          for attempt in 1 2 3; do
            if (cd "$OUT/ref" && limit 1800 maestro --device "$UDID" test "${MENV[@]}" "$GITHUB_WORKSPACE/tools/maestro/takeover-signin.yaml" < /dev/null); then signed=1; break; fi
            shot "ref-signin-failed-$attempt"; echo "::warning::the previous app did not sign in (try $attempt of 3)"
            limit 60 xcrun simctl terminate "$UDID" com.linea.messenger.preview >/dev/null 2>&1 || true
            sleep 10
          done
          [ "$signed" = 1 ] || { echo "::error::the previous app did not sign in after three tries"; exit 1; }

          stage "people write to the account and set up its world; the previous app decrypts them"
          # The seeding process stays running in the background for the whole job (SIM_SEED_SERVE): Ксюша types,
          # Тимур and Анна are online, act/ring.js and act/hangup.js ring the account through 127.0.0.1:3998.
          (SIM_SEED_RICH=1 SIM_SEED_SERVE=3998 nohup node tools/sim-seed.mjs http://127.0.0.1:3999 "$TEST_HANDLE" "$GITHUB_WORKSPACE/srvdata" "$TEST_LOGIN" "$TEST_PASSWORD" "$TEST_WORD" > "$OUT/seed.txt" 2>&1 &)
          for i in $(seq 1 240); do
            grep -q '"messages"' "$OUT/seed.txt" && break
            pgrep -f tools/sim-seed.mjs >/dev/null || { echo "the seeding process ended early"; break; }
            sleep 5
          done
          cat "$OUT/seed.txt"
          # Without the summary line the seeding stopped somewhere; the screens are still photographed with what
          # arrived (each pair is compared on the same data either way) and the report says so.
          grep -q '"messages"' "$OUT/seed.txt" || miss "seed" "the seeding did not finish (see seed.txt); the screens show what arrived"
          grep -E "^rich seed: .* not done|not seeded|not sent|not set" "$OUT/seed.txt" | while read -r line; do miss "seed" "$line"; done || true
          for i in $(seq 1 12); do curl -fsS http://127.0.0.1:3998/health >/dev/null && break; sleep 5; done || true
          curl -fsS http://127.0.0.1:3998/health >/dev/null || miss "seed-serve" "the seeding process does not answer on 127.0.0.1:3998 (no ring for the call pairs)"
          # The previous app opens the chats once (compare/act/read.yaml: Тимур's chat now ends with «Как тебе фото»).
          (cd "$OUT/ref" && limit 1800 maestro --device "$UDID" test "$FLOWS/act/read.yaml" < /dev/null) \
            || { shot ref-read-failed; miss "read" "the previous app did not open the chats once before the screens (ref-read-failed.jpg)"; }
          gather

          # ref NAME PHASE: the reference flow of one pair (or of a setup step: nothing photographed).
          ref() {
            local name="$1" phase="$2" seconds=420; [ "$phase" = setup ] && seconds=1200
            echo "-- $(date -u +%H:%M:%S) ref-$name"
            local ok=1
            (cd "$CMP" && limit "$seconds" maestro --device "$UDID" test "${MENV[@]}" "$FLOWS/ref-$name.yaml" < /dev/null) 2>&1 | tee "$OUT/ref-last.txt" || ok=0
            # A flow that stopped before the chat list was there (fourth run: ref-09's Maestro went quiet on «Чаты»
            # with the list on screen; ref-10 began while the list said «Соединение…») is run once more.
            if [ "$ok" = 0 ] && [ "$phase" != auth ] && ! grep -q 'Run act/ref-home.yaml... COMPLETED' "$OUT/ref-last.txt"; then
              echo "-- $(date -u +%H:%M:%S) ref-$name again (it stopped before the chat list)"; ok=1
              (cd "$CMP" && limit "$seconds" maestro --device "$UDID" test "${MENV[@]}" "$FLOWS/ref-$name.yaml" < /dev/null) || ok=0
            fi
            # The folder's setup is tried once more from the start when it stopped (the run of fd7a62c4: it stopped on the
            # chat list, and 21-folder-tab then had no folder on either side); a second folder of the same name does no
            # harm (the tab is found by its name, the first one is touched). The other setup flows send messages and
            # are not repeated.
            if [ "$ok" = 0 ] && [ "$name" = 00-setup-folder ]; then
              shot "compare/ref-$name-first-failed"
              echo "-- $(date -u +%H:%M:%S) ref-$name again (it stopped)"; ok=1
              (cd "$CMP" && limit "$seconds" maestro --device "$UDID" test "${MENV[@]}" "$FLOWS/ref-$name.yaml" < /dev/null) || ok=0
            fi
            if [ "$ok" = 0 ]; then
              shot "compare/ref-$name-failed"
              if [ "$phase" = setup ]; then miss "setup-$name" "the reference's setup flow stopped (the screen then: ref-$name-failed.png); later pairs may lack what it makes"
              else miss "ref-$name" "the Maestro flow did not reach the screen (what was shown instead: ref-$name-failed.png)"; fi
            fi
            gather
            [ "$phase" = setup ] || [ -f "$CMP/ref-$name.png" ] || [ -f "$CMP/ref-$name-failed.png" ] || miss "ref-$name" "no picture"
          }
          refs() { # phase
            while IFS=$'\t' read -r -u 3 name look wait args; do setlook "$look"; ref "$name" "$1"; done 3< <(rows "$1")
          }

          stage "the previous app: setup flows, then screen by screen"
          refs setup
          refs main
          setlook dark
          limit 60 xcrun simctl terminate "$UDID" com.linea.messenger.preview || true

          start() { # seconds, launch arguments… — always pointed at the local test server
            # -effects 1: «Снег» and «Ледяное стекло» on, as they are by default in the reference (the native app keeps
            # them off on the simulator unless asked), so the rime on the glass shows on both sides.
            # -linea.bar-glow.v1 off: the lights under the tab bar's glass are the native app's own addition with a switch
            # in «Оформление» (Shell/TabBar.swift `BarGlow`, read from the preferences, which a launch argument
            # overrides for this start only); off, the bar is plain glass as the reference's, so the pictures differ
            # by what is meant to be the same.
            local wait="$1"; shift
            limit 60 xcrun simctl terminate "$UDID" com.linea.messenger.preview >/dev/null 2>&1 || true
            limit 120 xcrun simctl launch "$UDID" com.linea.messenger.preview -server "$SERVER" -effects 1 -linea.bar-glow.v1 off "$@"
            sleep "$wait"
          }
          # nat NAME seconds args…: a screen reached by launch arguments alone.
          nat() {
            local name="$1"; shift; echo "-- $(date -u +%H:%M:%S) nat-$name"
            start "$@" || miss "nat-$name" "the app did not start"
            shot "compare/nat-$name"
            [ -f "$CMP/nat-$name.png" ] || miss "nat-$name" "no picture"
          }
          # natflow NAME seconds args…: started by launch arguments, then moved by the same gestures as the reference.
          natflow() {
            local name="$1"; shift; echo "-- $(date -u +%H:%M:%S) nat-$name (launch arguments, then nat/nat-$name.yaml)"
            start "$@" || miss "nat-$name" "the app did not start"
            if ! (cd "$CMP" && limit 420 maestro --device "$UDID" test "${MENV[@]}" "$FLOWS/nat/nat-$name.yaml" < /dev/null); then
              shot "compare/nat-$name-failed"; miss "nat-$name" "the Maestro flow did not reach the screen (what was shown instead: nat-$name-failed.png)"
            fi
            gather
            [ -f "$CMP/nat-$name.png" ] || [ -f "$CMP/nat-$name-failed.png" ] || miss "nat-$name" "no picture"
          }
          # The native app's own theme: -settheme light for a light pair, back to its default (black) after one.
          NATLIGHT=0
          nats() { # phase
            while IFS=$'\t' read -r -u 3 name look wait args; do
              setlook "$look"
              THEME=()
              # After a light pair: black again, and the night theme back to «Системная» as the previous app has it
              # (-settheme alone left it off, and «Оформление» then showed «Ночной режим» off where the reference has it on).
              if [ "$look" = light ]; then THEME=(-settheme light); NATLIGHT=1; elif [ "$NATLIGHT" = 1 ]; then THEME=(-settheme black -setnight system); NATLIGHT=0; fi
              eval "ARGS=($args)"
              if [ "$1" = main ] && [ "$NATIVE_STORAGE" != ok ]; then
                # Not a comparison picture (the storage error, see above): kept as what was shown instead.
                nat "$name-failed" "$wait" ${THEME[@]+"${THEME[@]}"} ${ARGS[@]+"${ARGS[@]}"}
                miss "nat-$name" "not reached: the native app did not open the storage (nat-$name-failed.png, takeover-check.txt)"
              elif [ -f "$FLOWS/nat/nat-$name.yaml" ]; then natflow "$name" "$wait" ${THEME[@]+"${THEME[@]}"} ${ARGS[@]+"${ARGS[@]}"}
              else nat "$name" "$wait" ${THEME[@]+"${THEME[@]}"} ${ARGS[@]+"${ARGS[@]}"}; fi
            done 3< <(rows "$1")
          }

          stage "the native app is installed OVER the previous one"
          limit 600 xcrun simctl install "$UDID" "$NATIVE_APP"
          grant
          # What the native app finds of the previous one, read only (native/ios/Sources/Storage/TakeoverCheck.swift, as
          # native-takeover.yml does): the session, the device key, the storage's key and file, and whether the storage
          # opens. Kept as takeover-check.txt. In the third run every native screen said «Не удалось открыть
          # зашифрованное хранилище» (Messenger.init threw, App/SceneDelegate.swift); this says why, and when the
          # storage does not open the gestures are left out (each would wait minutes for a chat list that never
          # comes and the shard would run out of time) — every screen is still photographed by its launch arguments.
          stage "what the native app finds of the previous one"
          NATIVE_STORAGE=ok
          start 20 -takeovercheck 1 -takeoveruser "$USER_ID" -takeoverexpect "Как тебе фото" -takeoverreport takeover-check.txt || true
          shot native-takeover-check
          container=$(limit 60 xcrun simctl get_app_container "$UDID" com.linea.messenger.preview data 2>/dev/null || true)
          cp "$container/Documents/takeover-check.txt" "$OUT/takeover-check.txt" 2>/dev/null || echo "VERDICT=NO REPORT" > "$OUT/takeover-check.txt"
          cat "$OUT/takeover-check.txt"
          if grep -q '^vaultopen=ok' "$OUT/takeover-check.txt"; then :; else
            NATIVE_STORAGE=failed
            miss "native-storage" "the native app does not open the previous app's storage: $(grep -E '^(token|vaultkey|vaultfile|vaultopen|VERDICT)' "$OUT/takeover-check.txt" | tr '\n' ' ') (takeover-check.txt); its screens show the storage error, gestures left out"
          fi
          stage "the native app, screen by screen"
          # The first start reads what the previous app left (session, keys, storage, its settings): given more
          # time, not photographed.
          start 40 || miss "native-first-start" "the native app's first start failed"
          shot native-first-start
          # takeover-check opens the storage in a screen of its own; the account itself is opened by the real start
          # (Messenger.init, App/SceneDelegate.swift), which logs «Linea: the account did not open: <error> (<step>)»
          # when it fails. The fourth run: takeover-check PASS, yet every native screen showed the storage error and
          # 56 flows waited minutes each for a chat list that never came. The line is kept (native-open.txt) and the
          # gestures are left out.
          # (The log tool prints its own filter first, with these very words: only the app's line, which goes on
          # with «: <error>», counts. The sixth run took that header for a failure while the account was open.)
          opened=$(limit 180 xcrun simctl spawn "$UDID" log show --last 5m --style compact --predicate 'eventMessage CONTAINS "Linea: the account did not open"' 2>/dev/null | grep -o 'Linea: the account did not open: .*' | tail -1 || true)
          if [ -n "$opened" ]; then
            echo "$opened" > "$OUT/native-open.txt"
            NATIVE_STORAGE=failed
            miss "native-storage" "takeover-check: $(grep '^VERDICT' "$OUT/takeover-check.txt" | tr -d '\n'), but the native app's own start did not open the account: $opened (native-first-start.jpg, native-open.txt); its screens show the storage error, gestures left out"
          fi
          nats main
          setlook dark
          limit 60 xcrun simctl terminate "$UDID" com.linea.messenger.preview || true

          if [ -n "$(rows auth)" ]; then
            # Signed out: the app and the simulator's keychain (where the session lives) are removed, the test CA
            # trusted again, and each app installed fresh in turn.
            fresh() {
              limit 60 xcrun simctl terminate "$UDID" com.linea.messenger.preview >/dev/null 2>&1 || true
              limit 120 xcrun simctl uninstall "$UDID" com.linea.messenger.preview || true
              limit 120 xcrun simctl keychain "$UDID" reset || true
              limit 120 xcrun simctl keychain "$UDID" add-root-cert tls/ca.pem
              limit 600 xcrun simctl install "$UDID" "$1"
              grant
            }
            stage "signed out: the previous app"
            if fresh "$REF_APP"; then refs auth; else miss "auth-ref" "the previous app could not be installed fresh"; fi
            stage "signed out: the native app"
            if fresh "$NATIVE_APP"; then nats auth; else miss "auth-nat" "the native app could not be installed fresh"; fi
          fi

          stage "done"
          shots=$(ls "$CMP" | grep -E '^(ref|nat)-[0-9]+-[a-z0-9-]+\.png$' | grep -vc -- '-failed\.png$' || true)
          wanted=$(( 2 * ( $(rows main | wc -l) + $(rows auth | wc -l) ) ))
          echo "shard $SHARD pictures: $shots of $wanted" | tee "$OUT/VERDICT.txt"
          [ "${shots:-0}" -gt 0 ]
      - name: Keep the shard's pictures and logs
        if: always()
        run: |
          OUT="$RUNNER_TEMP/out"; mkdir -p "$OUT"; cd "$OUT"
          [ -n "${UDID:-}" ] && perl -e 'alarm shift; exec @ARGV' 300 xcrun simctl spawn "$UDID" log show --last 3h --style compact --predicate 'process == "Invizent" OR process == "INVIZENT"' > app.log 2>/dev/null || true
          # The app's own lines (Linea: …) before the long log is cut to its tail below.
          [ -f app.log ] && { grep -a 'Linea:' app.log | tail -n 400 > app-linea.txt || true; }
          verdict=$(cat VERDICT.txt 2>/dev/null || echo "shard $SHARD NOT FINISHED (stopped at: $(cat STAGE.txt 2>/dev/null || echo start))")
          echo "$verdict ${{ steps.work.outcome }}" > VERDICT.txt
          # The comparison pictures stay full-size PNG (compare/); every other picture becomes a smaller JPEG.
          find . -path ./compare -prune -o -name '*.png' -exec sh -c 'sips -Z 1400 -s format jpeg -s formatOptions 80 "$1" --out "${1%.png}.jpg" >/dev/null 2>&1 && rm "$1"' _ {} \;
          find . -name 'commands-*.json' -delete; find . -path ./compare -prune -o -type f -size +3000k -exec sh -c 'tail -c 1500000 "$1" > "$1.tail" && rm "$1"' _ {} \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shot-${{ matrix.shard }}
          path: ${{ runner.temp }}/out
          retention-days: 7
      - name: Fail the job unless the shard ran
        if: steps.work.outcome != 'success'
        run: exit 1

  report:
    needs: [build, shoot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: shot-*
          path: ${{ runner.temp }}/shards
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: build-logs
          path: ${{ runner.temp }}/final/build
      - name: Pairs, difference scores, the report
        run: |
          set -uo pipefail
          FINAL="$RUNNER_TEMP/final"; CMP="$FINAL/compare"; mkdir -p "$CMP"
          for shard in "$RUNNER_TEMP"/shards/shot-*; do
            [ -d "$shard" ] || continue
            n="${shard##*-}"; mkdir -p "$FINAL/shard-$n"
            if [ -d "$shard/compare" ]; then
              cp "$shard"/compare/*.png "$CMP/" 2>/dev/null || true
              [ -f "$shard/compare/missing.txt" ] && cat "$shard/compare/missing.txt" >> "$CMP/missing.txt"
            fi
            (cd "$shard" && find . -path ./compare -prune -o -type f -print | while read -r f; do mkdir -p "$FINAL/shard-$n/$(dirname "$f")"; cp "$f" "$FINAL/shard-$n/$f"; done)
          done
          PLAN=tools/maestro/compare/plan.txt
          grep -vE '^[[:space:]]*(#|$)' "$PLAN" | awk -F'|' '{ for (i = 1; i <= NF; i++) gsub(/^[ \t]+|[ \t]+$/, "", $i); if ($3 != "setup") print $1 }' > "$CMP/names.txt"
          python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q pillow
          "$RUNNER_TEMP/venv/bin/python" tools/compare-pairs.py "$CMP" "$CMP/names.txt" || echo "::warning::the side-by-side pictures were not made"
          "$RUNNER_TEMP/venv/bin/python" tools/maestro/compare/diff.py "$CMP" "$PLAN" || echo "::warning::the difference scores were not made"
          head -40 "$CMP/REPORT.md" 2>/dev/null || true
          {
            echo "build: ${{ needs.build.result }}, shards: ${{ needs.shoot.result }}, $GITHUB_SHA, $(date -u)"
            cat "$FINAL"/shard-*/VERDICT.txt 2>/dev/null || echo "no shard finished"
          } > "$FINAL/STATUS.txt"
          cat "$FINAL/STATUS.txt"
      - name: Publish the pictures (branch native-compare-output)
        if: always()
        run: |
          FINAL="$RUNNER_TEMP/final"; mkdir -p "$FINAL"; cd "$FINAL"
          git init -q -b out && git config user.name "linea-ci" && git config user.email "ci@localhost"
          git add -A && git commit -qm "Native side-by-side comparison for $GITHUB_SHA: $(head -1 STATUS.txt 2>/dev/null)"
          for attempt in 1 2 3; do git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:native-compare-output" && break; sleep 15; done
