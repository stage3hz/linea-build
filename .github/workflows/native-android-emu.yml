# The native Android app (native/android, Kotlin) with the shared core (native/core, Rust), built for the emulator
# and photographed: first the shell with sample chats and the sign-in screen, then («live») the app signed in to
# a test server started on the runner, with really encrypted chats. Runs only for the branch `native-walk`. The
# result — the screenshots, or the end of the build log when something failed — goes to the branch
# native-emu-output, so it can be read without the Actions page. Nothing here touches the real server.
name: Native Android emulator check
on:
  push:
    branches: [native-walk]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: native-android-emu
  cancel-in-progress: true
jobs:
  emu:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the core and the app
        id: build
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"; OUT="$RUNNER_TEMP/out"
          exec > >(tee "$OUT/log.txt") 2>&1
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"; echo "SDK: $SDK"; ls "$SDK/ndk" || true
          # The runner's image comes with NDKs; if one day it does not, the pinned one is installed.
          if ! ls -d "$SDK"/ndk/*/ >/dev/null 2>&1; then yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" >/dev/null; fi
          # The Signal library inside the core needs protoc to build.
          which protoc || { sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler; }
          protoc --version
          echo "== test authority for the live check"
          # A certificate authority that lives for this run: the debug build made below trusts it for the
          # emulator's local test server only (app/build.gradle.kts, TestCaConfig). 10.0.2.2 is the emulator's
          # name for this machine. The key never leaves the runner.
          mkdir -p "$RUNNER_TEMP/tls" && cd "$RUNNER_TEMP/tls"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=INVIZENT Emulator Test CA" -keyout ca.key -out ca.pem -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign" 2>/dev/null
          openssl req -newkey rsa:2048 -nodes -subj "/CN=localhost" -keyout leaf.key -out leaf.csr 2>/dev/null
          printf "subjectAltName=DNS:localhost,IP:127.0.0.1,IP:10.0.2.2\nextendedKeyUsage=serverAuth\nbasicConstraints=CA:FALSE\nkeyUsage=digitalSignature,keyEncipherment\n" > ext.cnf
          openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -sha256 -extfile ext.cnf -out leaf.pem 2>/dev/null
          openssl verify -CAfile ca.pem leaf.pem
          cd "$GITHUB_WORKSPACE"
          echo "== core tests"; (cd native/core && cargo test --quiet 2>&1 | grep -E "test result|FAILED|panicked" || true)
          echo "== core for the emulator (x86_64)"; native/android/build-core.sh x86_64
          echo "== core for this machine (the JNI test of the unit tests)"; native/android/build-core-host.sh
          echo "== app"
          cd native/android
          INVIZENT_TEST_CA="$RUNNER_TEMP/tls/ca.pem" ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug > "$OUT/gradle.log" 2>&1 || { grep -nE "^e: |error:|FAILED|What went wrong" -A4 "$OUT/gradle.log" | head -80; tail -60 "$OUT/gradle.log"; exit 1; }
          tail -3 "$OUT/gradle.log"
          # How many tests ran, and how many were skipped (CoreJniTest is skipped without the core for this machine).
          grep -ho 'testsuite name="[^"]*" tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' app/build/test-results/testDebugUnitTest/*.xml || true
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "libinvizent_core|libsqlcipher|invizent_test_ca|classes"
          # The pages as drawn on the JVM by the tests (no phone): kept beside the emulator's own pictures.
          mkdir -p "$OUT/jvm-pages" && cp app/build/pages/*.png "$OUT/jvm-pages/" 2>/dev/null || true
          echo "== built"
      - name: What the live check runs with (the app's own code of the previous app, the server)
        id: prep
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          (cd mobile && npm ci --no-audit --no-fund >/dev/null 2>&1)
          (cd server && npm ci --no-audit --no-fund >/dev/null 2>&1)
          (cd desktop && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci --no-audit --no-fund >/dev/null 2>&1)
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on the emulator and photograph
        id: shots
        if: steps.build.outcome == 'success'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim -camera-back none
          # First the pages that need no server. Then real data: a local test server on this runner, a test
          # account, really encrypted chats (emu-live.sh). The live part has its own outcome (live-status.txt),
          # so a failure there does not hide the first pictures.
          script: |
            native/android/emu-shots.sh "$RUNNER_TEMP/out" > "$RUNNER_TEMP/out/shots-log.txt" 2>&1
            if [ "${{ steps.prep.outcome }}" = success ] && native/android/emu-live.sh "$RUNNER_TEMP/out" "$RUNNER_TEMP/tls" > "$RUNNER_TEMP/out/live-log.txt" 2>&1; then echo success > "$RUNNER_TEMP/live-status.txt"; else echo failure > "$RUNNER_TEMP/live-status.txt"; fi
      - name: Publish the result (branch native-emu-output)
        if: always()
        run: |
          cd "$RUNNER_TEMP/out" 2>/dev/null || { mkdir -p "$RUNNER_TEMP/out" && cd "$RUNNER_TEMP/out"; }
          LIVE="$(cat "$RUNNER_TEMP/live-status.txt" 2>/dev/null || echo skipped)"
          echo "build: ${{ steps.build.outcome }}, emulator: ${{ steps.shots.outcome }} $GITHUB_SHA $(date -u) $(uname -m) live:$LIVE" > STATUS.txt
          [ -f gradle.log ] && { grep -nE "^e: |^w: |error:|FAILED" gradle.log | head -200 > gradle-errors.txt; tail -200 gradle.log > gradle-tail.txt; rm gradle.log; } || true
          git init -q -b out && git config user.name "linea-ci" && git config user.email "ci@localhost"
          git add -A && git commit -qm "Native emulator check for $GITHUB_SHA: build ${{ steps.build.outcome }}, emulator ${{ steps.shots.outcome }}, live $LIVE"
          for attempt in 1 2 3; do git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:native-emu-output" && break; sleep 15; done
      - name: Fail the job if the work failed
        if: always()
        run: |
          [ "${{ steps.build.outcome }}" = success ] && [ "${{ steps.shots.outcome }}" = success ] && [ "$(cat "$RUNNER_TEMP/live-status.txt" 2>/dev/null)" = success ]
