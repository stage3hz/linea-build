plugins { id 'org.jetbrains.kotlin.jvm' version '2.2.20' }
repositories { mavenCentral() }
kotlin { jvmToolchain(21) }
sourceSets {
  main.kotlin {
    srcDirs '../android/src/main/java'
    include '**/PhotoPixels.kt'
    include '**/PhotoOptions.kt'
    include '**/PhotoSource.kt'
    include '**/PhotoGainmap.kt'
  }
  test.kotlin.srcDirs '../android/src/test/java'
  test.resources.srcDirs '../android/src/test/resources'
}
dependencies { testImplementation 'junit:junit:4.13.2' }
test { systemProperty 'geometry.golden', file('../../../test/fixtures/geometry-cases.json').absolutePath; testLogging { events 'passed', 'failed', 'skipped'; exceptionFormat 'short' } }
